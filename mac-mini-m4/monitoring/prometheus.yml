global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    site: mac-mini
    role: primary

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

# Local scrape targets — all on the Mac Mini
scrape_configs:
  - job_name: mac-mini-prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: mac-mini-node
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: mac-mini-homeassistant
    metrics_path: /api/prometheus
    bearer_token_file: /etc/prometheus/ha-token
    static_configs:
      - targets: ["localhost:8123"]

  - job_name: mac-mini-postgres
    static_configs:
      - targets: ["localhost:9187"]

  - job_name: mac-mini-mongodb
    static_configs:
      - targets: ["localhost:9216"]

  - job_name: mac-mini-dns
    static_configs:
      - targets: ["localhost:9105"]

  # Komodo Core HTTPS health probe (https-probes-komodo) replaces this — port 9120 served only HTML, no metrics
  # LLM metrics — murderbot: vLLM metrics endpoint (port 8088)
  - job_name: murderbot-vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["10.100.20.19:8088"]
        labels:
          node: murderbot
    relabel_configs:
      - target_label: instance
        replacement: murderbot

  # Node metrics — murderbot: direct scrape with node label for Grafana host variable
  - job_name: murderbot-node
    static_configs:
      - targets: ["10.100.20.19:9100"]
        labels:
          node: murderbot
    relabel_configs:
      - target_label: instance
        replacement: murderbot

  # Node metrics — archlinux: direct scrape with node label for Grafana host variable
  - job_name: archlinux-node
    static_configs:
      - targets: ["10.100.20.25:9100"]
        labels:
          node: archlinux
    relabel_configs:
      - target_label: instance
        replacement: archlinux

  # GPU metrics — murderbot: nvidia-exporter for GPU health (nvidia_gpu_*)
  - job_name: murderbot-nvidia
    static_configs:
      - targets: ["10.100.20.19:9101"]
        labels:
          node: murderbot

  # GPU metrics — archlinux: amdgpu-exporter (port 9101, deploy archlinux/gpu-exporter stack first)
  - job_name: archlinux-amd-gpu
    static_configs:
      - targets: ["10.100.20.25:9101"]
        labels:
          node: archlinux
    relabel_configs:
      - target_label: instance
        replacement: archlinux

  # Cross-stack heartbeat — k3s Prometheus health probe (MetalLB LoadBalancer VIP)
  - job_name: k3s-prometheus-heartbeat
    scheme: http
    scrape_interval: 30s
    static_configs:
      # MetalLB VIP assigned by the k3s-prometheus-heartbeat Service;
      # k3s Prometheus does not listen directly on node ports.
      # Was 10.100.20.206 (that's actually argocd-server's LB VIP — MetalLB
      # reassigned pool addresses at some point and this target went stale,
      # so the heartbeat was probing the wrong service the whole time).
      - targets: ["10.100.20.201:9090"]
        labels:
          cluster: k3s-dean

  # Blackbox exporter itself — metrics about the probe system health
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["localhost:9115"]

  # HTTPS probes for core web services — one job per target to carry unique {service} labels for alerting
  - job_name: https-probes-media
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["media.amer.dev"]
        labels:
          stack: web-services
          service: jellyfin
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  - job_name: https-probes-komodo
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["komodo.amer.dev"]
        labels:
          stack: web-services
          service: komodo
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  - job_name: https-probes-argo
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["argo.amer.dev"]
        labels:
          stack: web-services
          service: argo-workflows
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  - job_name: https-probes-argocd
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["argocd.amer.dev"]
        labels:
          stack: web-services
          service: argocd
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  - job_name: https-probes-grafana
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["grafana.amer.dev"]
        labels:
          stack: web-services
          service: grafana
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  - job_name: https-probes-z2m
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["z2m-dean-1.amer.dev"]
        labels:
          stack: web-services
          service: zigbee2mqtt
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  # LiteLLM readiness probe — 503 when its postgres DB is unreachable (models disappear from OWU)
  - job_name: https-probes-litellm
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["litellm.amer.dev/health/readiness"]
        labels:
          stack: llm
          service: litellm
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  # OpenWebUI probe — primary chat interface (zoidberg.amer.dev)
  - job_name: https-probes-owui
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["zoidberg.amer.dev"]
        labels:
          stack: llm
          service: openwebui
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__
