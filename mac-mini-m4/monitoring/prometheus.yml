global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    site: mac-mini
    role: primary

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

# Local scrape targets — all on the Mac Mini
scrape_configs:
  - job_name: mac-mini-prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: mac-mini-node
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: mac-mini-homeassistant
    metrics_path: /api/prometheus
    bearer_token_file: /etc/prometheus/ha-token
    static_configs:
      - targets: ["localhost:8123"]

  - job_name: mac-mini-postgres
    static_configs:
      - targets: ["localhost:9187"]

  - job_name: mac-mini-mongodb
    static_configs:
      - targets: ["localhost:9216"]

  - job_name: mac-mini-dns
    static_configs:
      - targets: ["localhost:9105"]

  # Komodo Core HTTPS health probe (https-probes-komodo) replaces this — port 9120 served only HTML, no metrics
  # LLM metrics — murderbot: llama.cpp metrics endpoint (port 8088)
  - job_name: murderbot-llm
    metrics_path: /metrics
    static_configs:
      - targets: ["10.100.20.19:8088"]
        labels:
          node: murderbot
    relabel_configs:
      - target_label: instance
        replacement: murderbot

  # Node metrics — murderbot: direct scrape with node label for Grafana host variable
  - job_name: murderbot-node
    static_configs:
      - targets: ["10.100.20.19:9100"]
        labels:
          node: murderbot
    relabel_configs:
      - target_label: instance
        replacement: murderbot

  # Node metrics — archlinux: direct scrape with node label for Grafana host variable
  - job_name: archlinux-node
    static_configs:
      - targets: ["10.100.20.25:9100"]
        labels:
          node: archlinux
    relabel_configs:
      - target_label: instance
        replacement: archlinux

  # GPU metrics — murderbot: nvidia-exporter for GPU health (nvidia_gpu_*)
  - job_name: murderbot-nvidia
    static_configs:
      - targets: ["10.100.20.19:9101"]
        labels:
          node: murderbot

  # GPU metrics — archlinux: amdgpu-exporter (port 9101, deploy archlinux/gpu-exporter stack first)
  - job_name: archlinux-amd-gpu
    static_configs:
      - targets: ["10.100.20.25:9101"]
        labels:
          node: archlinux
    relabel_configs:
      - target_label: instance
        replacement: archlinux

  # Cross-stack heartbeat — k3s Prometheus health probe (MetalLB LoadBalancer VIP)
  - job_name: k3s-prometheus-heartbeat
    scheme: http
    scrape_interval: 30s
    static_configs:
      # MetalLB VIP assigned by the k3s-prometheus-heartbeat Service;
      # k3s Prometheus does not listen directly on node ports.
      # Was 10.100.20.206 (that's actually argocd-server's LB VIP — MetalLB
      # reassigned pool addresses at some point and this target went stale,
      # so the heartbeat was probing the wrong service the whole time).
      - targets: ["10.100.20.201:9090"]
        labels:
          cluster: k3s-dean

  # Blackbox exporter itself — metrics about the probe system health
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["localhost:9115"]

  # Alertmanager's own metrics — was not monitored at all before 2026-08-26,
  # meaning a run of Pushover delivery failures (alertmanager_notifications_
  # failed_total) was invisible. See AlertmanagerNotificationsFailing rule.
  - job_name: mac-mini-alertmanager
    static_configs:
      - targets: ["localhost:9093"]

  # TCP-connect reachability to the k3s Traefik ingress VIP (port 443) —
  # isolates "can't reach the VIP at all" (L3/L4) from "reached it, HTTP
  # failed" (L7). Added after the 2026-08-26 incident where every
  # https-probes-* target failed together for exactly 06:03-06:17 UTC with no
  # corresponding signal anywhere else (Traefik logs clean, MetalLB stable,
  # node network counters clean).
  #
  # NOT icmp: confirmed live (2026-08-26) that this MetalLB L2 VIP simply
  # does not answer ICMP echo at all — even a plain `ping` from another k3s
  # node gets "Destination Host Unreachable" — while HTTPS to the same VIP
  # works perfectly at the same moment. An icmp module here would be
  # permanently false-critical, not a real signal. tcp_connect against the
  # actual LoadBalancer port is the correct equivalent for a VIP.
  - job_name: tcp-probe-traefik-vip
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["10.100.20.203:443"]
        labels:
          service: traefik-vip
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  # ICMP reachability to every always-on k3s node — a comparison point for
  # TraefikVipUnreachable. If one or more of these ALSO drop while the VIP
  # probe drops, the problem is a broader network segment issue, not the
  # VIP/MetalLB layer specifically. archlinux is deliberately excluded: it's
  # a node that sleeps by design, so it being unreachable is expected/benign,
  # not a network-path incident — including it here would make this alert
  # page routinely for normal behavior. (rpi5-0/rpi5-1/rpi4-0/murderbot are
  # not just "the rest of the nodes" here — TraefikVipUnreachable's
  # diagnostic value is "does the network segment problem extend beyond the
  # VIP," and a sleeping node answering that "yes" would be a false
  # correlation.)
  - job_name: icmp-probe-k3s-nodes
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["10.100.20.10"]
        labels:
          node: rpi5-0
      - targets: ["10.100.20.11"]
        labels:
          node: rpi5-1
      - targets: ["10.100.20.12"]
        labels:
          node: rpi4-0
      - targets: ["10.100.20.19"]
        labels:
          node: murderbot
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  # HTTPS probes for core web services — one job per target to carry unique {service} labels for alerting
  - job_name: https-probes-media
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["media.amer.dev"]
        labels:
          stack: web-services
          service: jellyfin
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  - job_name: https-probes-komodo
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["komodo.amer.dev"]
        labels:
          stack: web-services
          service: komodo
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  - job_name: https-probes-argo
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["argo.amer.dev"]
        labels:
          stack: web-services
          service: argo-workflows
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  - job_name: https-probes-argocd
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["argocd.amer.dev"]
        labels:
          stack: web-services
          service: argocd
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  - job_name: https-probes-grafana
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["grafana.amer.dev"]
        labels:
          stack: web-services
          service: grafana
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  - job_name: https-probes-z2m
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["z2m-dean-1.amer.dev"]
        labels:
          stack: web-services
          service: zigbee2mqtt
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  # LiteLLM readiness probe — 503 when its postgres DB is unreachable (models disappear from OWU)
  - job_name: https-probes-litellm
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["litellm.amer.dev/health/readiness"]
        labels:
          stack: llm
          service: litellm
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  # OpenWebUI probe — primary chat interface (zoidberg.amer.dev)
  - job_name: https-probes-owui
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["zoidberg.amer.dev"]
        labels:
          stack: llm
          service: openwebui
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  # mem0 probe — memory service used by every praetor agent (search_memory/add_memory)
  - job_name: https-probes-mem0
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["mem0.amer.dev"]
        labels:
          stack: llm
          service: mem0
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  # CouchDB probe — Obsidian Self-hosted LiveSync backend (vault sync)
  - job_name: https-probes-couchdb
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets: ["couchdb.amer.dev"]
        labels:
          stack: db
          service: couchdb
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  # Qdrant probe — vector store backing mem0/RAG. No ingress; plain TCP check
  # against the LAN port (network_mode: host on the mini).
  - job_name: tcp-probes-qdrant
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["10.100.20.18:6333"]
        labels:
          stack: db
          service: qdrant
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  # libsync-redis probe — dedicated Redis for KOReader kosync (k3s libsync app).
  - job_name: tcp-probes-libsync-redis
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["10.100.20.18:6379"]
        labels:
          stack: db
          service: libsync-redis
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  # Ollama (mini) probe — dashboard health signal only, no dedicated alert
  # (paired with murderbot-llm as the two "LLM backend" health tiles).
  - job_name: http-probe-ollama-mini
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["10.100.20.18:11434"]
        labels:
          stack: llm
          service: ollama-mini
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__

  # Technitium real DNS-resolution probe (queries the resolver on :5354
  # directly) — distinct from mac-mini-dns (exporter/admin-API scrape), which
  # can read "up" while the resolver itself is dead. See blackbox.yml.
  - job_name: dns-resolution-probe
    metrics_path: /probe
    params:
      module: [dns_technitium]
    static_configs:
      - targets: ["127.0.0.1:5354"]
        labels:
          service: technitium
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: localhost:9115
        target_label: __address__
