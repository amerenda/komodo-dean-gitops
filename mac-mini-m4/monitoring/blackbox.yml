# Modules loaded once at process start (no --web.enable-lifecycle) — see
# sync-stacks.sh, which restarts blackbox-exporter specifically on changes here.
modules:
  https_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: true
      valid_http_versions: ["HTTP/2.0", "HTTP/1.1"]
      valid_status_codes: []
      tls_config:
        insecure_skip_verify: false
      headers:
        User-Agent: "blackbox-health-probe/1.0"

  tcp_connect:
    prober: tcp
    timeout: 5s

  # Internal HTTP targets that don't terminate TLS (e.g. Ollama on the mini,
  # bare LAN ports). https_2xx forces fail_if_not_ssl, which makes it unusable here.
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      valid_http_versions: ["HTTP/2.0", "HTTP/1.1"]
      valid_status_codes: []
      headers:
        User-Agent: "blackbox-health-probe/1.0"

  # ICMP reachability — isolates L3 network-path failures from L7 (HTTP)
  # failures. Requires NET_RAW on the blackbox-exporter container (see
  # compose.yaml). Added 2026-08-26 after a 14-minute outage where every
  # Traefik-ingress-routed service failed simultaneously but Traefik itself,
  # MetalLB, node health, and node network-interface counters all looked
  # clean — there was no signal available to tell "can't even reach the VIP"
  # apart from "reached it, but the HTTP response failed."
  icmp:
    prober: icmp
    timeout: 5s

  # Queries the actual Technitium resolver (UDP/5354), not the admin API.
  # 2026-07-19 incident: the DNS listener silently stopped answering while the
  # admin port (5380, what technitium-exporter scrapes) kept responding fine —
  # Docker/exporter both reported healthy for 35+ hours. Only a real query
  # against the resolver port catches that failure mode.
  dns_technitium:
    prober: dns
    timeout: 5s
    dns:
      query_name: "ha.amer.dev"
      query_type: "A"
      valid_rcodes:
        - NOERROR
