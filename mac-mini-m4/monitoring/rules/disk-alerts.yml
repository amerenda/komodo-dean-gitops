groups:
  - name: disk-space-alerts
    rules:

      # Warning: < 20% free — early heads-up before things break.
      # Excludes tmpfs, overlay (container layers), squashfs (snap/flatpak), and virtiofs
      # (mac-mini's OrbStack guest VM exposes the macOS host disk as 6 separate virtiofs
      # shares — /Applications, /Library, /Users, /Volumes, /mnt/mac, /private — all the
      # same underlying device with the same bogus size, so they'd otherwise fire as 6
      # duplicate alerts for one non-actionable number).
      - alert: DiskSpaceLow
        expr: >
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|overlay|aufs|squashfs|virtiofs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|overlay|aufs|squashfs|virtiofs"}
          ) * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: >
            {{ $labels.mountpoint }} on {{ $labels.instance }} has
            {{ $value | printf "%.1f" }}% free ({{ $labels.fstype }}).
            Warning threshold: 20%.

      # Critical: < 10% free — mirrors the level that caused the 2026-07-12 outage.
      - alert: DiskSpaceCritical
        expr: >
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|overlay|aufs|squashfs|virtiofs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|overlay|aufs|squashfs|virtiofs"}
          ) * 100 < 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: disk nearly full on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: >
            {{ $labels.mountpoint }} on {{ $labels.instance }} has only
            {{ $value | printf "%.1f" }}% free ({{ $labels.fstype }}).
            Run: docker builder prune -a -f
