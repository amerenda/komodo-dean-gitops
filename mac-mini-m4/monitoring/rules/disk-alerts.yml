groups:
  - name: disk-space-alerts
    rules:

      # Warning: < 20% free — early heads-up before things break.
      # Excludes tmpfs, overlay (container layers), squashfs (snap/flatpak), and virtiofs
      # (mac-mini's OrbStack guest VM exposes the macOS host disk as 6 separate virtiofs
      # shares — /Applications, /Library, /Users, /Volumes, /mnt/mac, /private — all the
      # same underlying device with the same bogus size, so they'd otherwise fire as 6
      # duplicate alerts for one non-actionable number).
      # job="mac-mini-node" is additionally collapsed to one mountpoint: node-exporter
      # inside the mini's OrbStack VM also reports /var/lib/rancher/k3s, /var/lib/kubelet,
      # /var/lib/cni, and /opt/orbstack-guest/data as separate mountpoints, but they're
      # all the same underlying device (/dev/vdb1) as /var/lib/docker — same disk,
      # would otherwise fire 5x for one real condition. Other hosts are untouched here
      # since their extra mountpoints (e.g. murderbot's /mnt/storage) are genuinely
      # separate volumes, not duplicates.
      # murderbot and archlinux are k3s nodes AND directly scraped by this Prometheus
      # (job=murderbot-node/archlinux-node, instance=<hostname>), so k3s's own
      # node-exporter DaemonSet scrapes them too and remote_writes a second copy in
      # here under job=node-exporter with a raw instance=<ip>:9100 label. That raw
      # instance format is unique to the k3s remote_write path (direct scrapes always
      # relabel instance to the hostname), so excluding those two IPs drops only the
      # duplicate copy — never the direct-scrape series, and never other k3s-only
      # nodes (rpi5-0/1, rpi4-0) which have no direct-scrape counterpart to worry about.
      - alert: DiskSpaceLow
        expr: >
          (
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|overlay|aufs|squashfs|virtiofs", job!="mac-mini-node", instance!~"10\\.100\\.20\\.19:9100|10\\.100\\.20\\.25:9100"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|overlay|aufs|squashfs|virtiofs", job!="mac-mini-node", instance!~"10\\.100\\.20\\.19:9100|10\\.100\\.20\\.25:9100"}
            )
            or
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|overlay|aufs|squashfs|virtiofs", job="mac-mini-node", mountpoint="/var/lib/docker"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|overlay|aufs|squashfs|virtiofs", job="mac-mini-node", mountpoint="/var/lib/docker"}
            )
          ) * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: >
            {{ $labels.mountpoint }} on {{ $labels.instance }} has
            {{ $value | printf "%.1f" }}% free ({{ $labels.fstype }}).
            Warning threshold: 20%.
          dashboard_url: "https://grafana.amer.dev/d/infra-node-exporter/infra3a-node-exporter?var-instance={{ $labels.instance }}"

      # Critical: < 10% free — mirrors the level that caused the 2026-07-12 outage.
      # Same job="mac-mini-node" mountpoint dedup and murderbot/archlinux k3s-copy
      # exclusion as DiskSpaceLow above — see comments there.
      - alert: DiskSpaceCritical
        expr: >
          (
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|overlay|aufs|squashfs|virtiofs", job!="mac-mini-node", instance!~"10\\.100\\.20\\.19:9100|10\\.100\\.20\\.25:9100"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|overlay|aufs|squashfs|virtiofs", job!="mac-mini-node", instance!~"10\\.100\\.20\\.19:9100|10\\.100\\.20\\.25:9100"}
            )
            or
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|overlay|aufs|squashfs|virtiofs", job="mac-mini-node", mountpoint="/var/lib/docker"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|overlay|aufs|squashfs|virtiofs", job="mac-mini-node", mountpoint="/var/lib/docker"}
            )
          ) * 100 < 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: disk nearly full on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: >
            {{ $labels.mountpoint }} on {{ $labels.instance }} has only
            {{ $value | printf "%.1f" }}% free ({{ $labels.fstype }}).
            Run: docker builder prune -a -f
          dashboard_url: "https://grafana.amer.dev/d/infra-node-exporter/infra3a-node-exporter?var-instance={{ $labels.instance }}"
