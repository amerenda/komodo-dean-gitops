groups:
  - name: llm-inference-alerts
    rules:

      # llama-server (llama.cpp) scrape target unreachable — no models can run.
      # This is the lowest-level signal: if this fires, LiteLLM and OWU will
      # lose all models within seconds.
      - alert: LLMBackendDown
        expr: up{job="murderbot-llm"} == 0
        for: 3m
        labels:
          severity: critical
          stack: llm
        annotations:
          summary: "LLM backend (llama.cpp) is unreachable on murderbot"
          description: |
            Prometheus cannot scrape the llama-server metrics endpoint at 10.100.20.19:8088.
            LiteLLM will return errors for all model requests.

            Check: systemctl status llama-server  (or the llama.cpp process)
            Check: curl http://10.100.20.19:8088/v1/models

      # LiteLLM readiness endpoint returning non-2xx — usually means postgres is down.
      # Root cause of 2026-07-12 outage: Prometheus data filled disk → postgres crashed
      # → LiteLLM DB unreachable → models disappeared from OWU.
      - alert: LiteLLMDown
        expr: probe_success{job="https-probes-litellm"} == 0
        for: 2m
        labels:
          severity: critical
          stack: llm
        annotations:
          summary: "LiteLLM is down or unhealthy ({{ $labels.instance }})"
          description: |
            The LiteLLM /health/readiness endpoint is not returning 2xx.
            This usually means its postgres database (10.100.20.18:5432) is unreachable.

            Immediate check:
              kubectl logs -n litellm -l app=litellm-server --tail=50
              docker logs postgres --tail=30  (on mac-mini)
              df -h  (check disk space on mac-mini — Prometheus data is the usual culprit)

      # OpenWebUI unreachable — primary model chat interface is down.
      - alert: OpenWebUIDown
        expr: probe_success{job="https-probes-owui"} == 0
        for: 5m
        labels:
          severity: critical
          stack: llm
        annotations:
          summary: "OpenWebUI (zoidberg.amer.dev) is unreachable"
          description: |
            The OpenWebUI chat interface is not returning 2xx.
            Models will be inaccessible from the web UI.

            Check: kubectl get pods -n openwebui
            Check: kubectl logs -n openwebui -l app=openwebui --tail=50

      # Generation speed has dropped well below normal for every murderbot profile
      # (qwen38 ~40 t/s, qwen36 ~120-140 t/s MTP, qwen3coder ~156 t/s no-MTP).
      # Below 30 t/s means CPU offload kicked in, the model is partially on disk,
      # or something else is competing for VRAM. Not expected during normal operation.
      #
      # Computed as a windowed ratio of the two cumulative counters
      # (tokens generated / seconds spent generating), NOT the server's own
      # llamacpp:predicted_tokens_seconds gauge -- that gauge was verified (2026-08-24)
      # to read 0 even mid-generation on the current llama.cpp build (b10502), so any
      # alert built directly on it is a permanent false positive once real traffic
      # keeps rate(tokens_predicted_total) > 0 satisfied continuously (e.g. an agentic
      # coding session's frequent short bursts, as opposed to sparse interactive chat).
      # This ratio form is engine/model-agnostic -- it'll read correctly no matter
      # which of the three switchable profiles (or a future one) is active, since it's
      # derived from the same two counters every profile increments identically.
      #
      # Gated on rate(tokens_predicted_total) > 0 so it doesn't fire when idle
      # (both counters go flat during idle, which would otherwise divide 0/0 -> NaN).
      - alert: LlamaGenerationSlow
        expr: >
          (rate(llamacpp:tokens_predicted_total{node="murderbot"}[5m])
            / rate(llamacpp:tokens_predicted_seconds_total{node="murderbot"}[5m])) < 30
          AND rate(llamacpp:tokens_predicted_total{node="murderbot"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "llama-server generation speed is below 30 t/s on murderbot"
          description: |
            Current windowed average generation speed: {{ $value | printf "%.1f" }} tokens/s.
            Normal: ~40 t/s (qwen38), ~120-140 t/s (qwen36, MTP), ~156 t/s (qwen3coder, no-MTP).

            Possible causes:
              - Another GPU workload (ComfyUI, FLUX) is sharing VRAM
              - CPU offload kicked in (NGL too low for VRAM available)
              - Thermal throttling
              - OOM killer reduced GPU memory

            Check: nvidia-smi, check for running ComfyUI/FLUX processes.
            Check: gpu-switcher /status to confirm which profile is actually active.

      # The highest token count seen by the server since startup has crossed 85% of
      # the context window. This is the leading indicator for the overflow/timeout
      # cascade. Gated on rate(prompt_tokens_total) > 0 so it doesn't fire when idle.
      - alert: LlamaContextNearFull
        expr: >
          llamacpp:n_tokens_max{node="murderbot"} / 131072 > 0.85
          AND rate(llamacpp:prompt_tokens_total{node="murderbot"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "llama-server context is {{ $value | humanizePercentage }} full on murderbot"
          description: |
            The largest request processed since last restart used
            {{ $value | humanizePercentage }} of the 131072-token context window.

            At this level, each request takes significantly longer to process
            (prompt eval time scales linearly with context size), increasing the
            risk of opencode HTTP timeouts and broken pipe errors.

            If opencode's compaction hasn't fired automatically, consider
            restarting the session to clear the context.
