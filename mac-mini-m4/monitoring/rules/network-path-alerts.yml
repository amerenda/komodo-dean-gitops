groups:
  - name: network-path-alerts
    rules:

      # Incident 2026-08-26 06:03-06:17 UTC: every single https-probes-*
      # target (argocd, grafana, komodo, litellm, jellyfin, mem0, couchdb,
      # openwebui, argo-workflows, zigbee2mqtt) went down together for
      # exactly 14 minutes. Traefik's pod never restarted and logged zero
      # errors; MetalLB's VIP announcement never changed (no failover, no
      # gratuitous ARP); the node's own network-interface counters showed no
      # errors/drops. Everything checked via direct IP/port on the mini
      # itself (Postgres, Mongo, HA, Technitium's real resolver, Qdrant,
      # libsync-redis) stayed clean throughout. The only thing every failing
      # target shared was "reachable via the Traefik ingress VIP" — but there
      # was no direct signal for that path itself, only its symptoms. This
      # alert is that direct signal.
      - alert: TraefikVipUnreachable
        expr: probe_success{job="tcp-probe-traefik-vip"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "k3s Traefik ingress VIP (10.100.20.203:443) is unreachable"
          description: |
            A TCP connection to the Traefik VIP's HTTPS port has been failing
            for 2+ minutes. Every *.amer.dev service (regardless of which
            host actually backs it) will appear down during this — check
            WebServiceDown/LiteLLMDown/Mem0Down/etc. firing together as the
            fingerprint of this exact failure mode before troubleshooting
            each app individually.

            Check: does K3sNodeUnreachable also fire? If yes, this is a
            broader network-segment issue, not MetalLB/VIP-specific.
            Check: kubectl get pods -n metallb-system
            Check: curl -v https://argocd.amer.dev (should fail the same way)

      # Comparison signal for TraefikVipUnreachable above — see that alert's
      # description. Fires per-node ($labels.node) across every always-on
      # k3s node (rpi5-0, rpi5-1, rpi4-0, murderbot) — not just whichever one
      # happens to host Traefik, since scoping this to a single node both
      # goes stale the moment that pod is rescheduled and makes the alert
      # name a lie. archlinux is deliberately excluded from the probe (see
      # prometheus.yml): it's a node that sleeps by design, so treating its
      # unreachability as a network incident would page routinely for normal
      # behavior — confirmed 2026-08-26 when it fired correctly for a real
      # archlinux outage, but Alex confirmed archlinux going unreachable is
      # expected/benign, not signal. Not expected to fire on its own; if one
      # or more of the remaining nodes fire without the VIP alert, that's a
      # plain node/segment reachability issue unrelated to Traefik. If
      # several fire together with the VIP alert, that's a broader
      # network-segment issue.
      - alert: K3sNodeUnreachable
        expr: probe_success{job="icmp-probe-k3s-nodes"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "k3s node {{ $labels.node }} ({{ $labels.instance }}) is unreachable via ICMP"
          description: |
            Direct ping to k3s node {{ $labels.node }} has been failing for
            2+ minutes. Correlate with TraefikVipUnreachable and with how
            many *other* nodes are also firing this same alert: one node
            alone points at that node specifically; several at once (or
            alongside the VIP alert) points at a broader network-segment
            issue.

      # Every alert built on probe_success (WebServiceDown, LiteLLMDown,
      # Mem0Down, CouchDBDown, TraefikVipUnreachable, K3sNodeUnreachable,
      # etc. — effectively the entire probe-based half of this monitoring
      # stack) silently stops firing if blackbox-exporter itself is down,
      # because Prometheus's `== 0` comparisons only match a metric that IS
      # present with value 0 — they don't match a metric that's gone
      # entirely absent. This alert is evaluated on `up{job="blackbox-
      # exporter"}`, a direct Prometheus scrape of blackbox-exporter's own
      # /metrics — independent of the /probe indirection every other check
      # here goes through — so it doesn't share that blind spot.
      - alert: BlackboxExporterDown
        expr: up{job="blackbox-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "blackbox-exporter is down — every probe-based alert is blind right now"
          description: |
            Prometheus cannot scrape blackbox-exporter (localhost:9115) for
            2+ minutes. WebServiceDown, LiteLLMDown, Mem0Down, CouchDBDown,
            TraefikVipUnreachable, K3sNodeUnreachable, and every other
            probe_success-based alert will NOT fire while this is true, no
            matter what's actually happening to the services they check.

            Check: docker logs blackbox-exporter --tail=50 (on mac-mini-m4)
            Check: docker ps | grep blackbox-exporter

      # 2026-08-26: found 9 lifetime Pushover delivery failures
      # (alertmanager_notifications_failed_total{reason="other"}) with no
      # way to tell when they happened, because Alertmanager's own /metrics
      # was never scraped. This closes that blind spot — a run of failed
      # deliveries (e.g. resolved-notifications silently not arriving) is
      # now itself alertable, instead of only discoverable by noticing a
      # cumulative counter looks too high days later.
      - alert: AlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager failed to deliver {{ $value | printf \"%.0f\" }} notification(s) via {{ $labels.integration }}"
          description: |
            alertmanager_notifications_failed_total{integration="{{ $labels.integration }}"}
            increased in the last 15 minutes. This means some alert
            (possibly a RESOLVED notification) silently did not reach
            Pushover. Check Alertmanager's own logs on mac-mini-m4 for the
            actual error — this alert only proves failures happened, not why.
