# monitoring stack
services:
  # ============================================================
  # Prometheus — Central metrics store
  # Receives remote_write from k3s Prometheus Agent + scrapes local exporters.
  # Grafana runs locally in this stack and queries this instance.
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.11.2
    container_name: prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - prometheus-data:/prometheus
      - ${MONITORING_DIR:-.}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${MONITORING_DIR:-.}/ha-token:/etc/prometheus/ha-token:ro
      - ${MONITORING_DIR:-.}/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      # Hard cap: prevents disk-fill outages (root cause of 2026-07-12 postgres crash).
      # Prometheus deletes oldest TSDB blocks once total exceeds this limit.
      - '--storage.tsdb.retention.size=40GB'
      - '--web.enable-remote-write-receiver'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # Alertmanager — Receives firing alerts from Prometheus, manages silences and notifications.
  # Primary Alertmanager for the whole homelab — routes to Pushover. The real config with
  # credentials is written by scripts/inject-secrets.sh (BWS), not by the file in git; see
  # alertmanager.yml for the placeholder. k3s runs its own independent secondary Alertmanager
  # whose only job is alerting if this instance (or mini's Prometheus) becomes unreachable.
  # ============================================================
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    network_mode: host
    volumes:
      - alertmanager-data:/alertmanager
      - ${MONITORING_DIR:-.}/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # Grafana — Primary dashboards/UI on mac-mini
  # Reads from local Prometheus TSDB.
  # ============================================================
  grafana:
    # 12.1.x had flaky datasource provisioning with fixed UIDs + SQLite; 12.4.x is stable here.
    image: grafana/grafana:12.4.3
    container_name: grafana
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_SERVER_ROOT_URL: "https://grafana.amer.dev"
      GF_SERVER_DOMAIN: "grafana.amer.dev"
      GF_USERS_HOME_PAGE: /d/home/home
    volumes:
      - grafana-data:/var/lib/grafana
      - ${MONITORING_DIR:-.}/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ${MONITORING_DIR:-.}/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ${MONITORING_DIR:-.}/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # Node Exporter — Host metrics (CPU, memory, disk, network)
  # textfile-collector dir picks up mac_mini_tcp.prom, written every 30s by
  # the native com.local.tcp-textfile-exporter LaunchDaemon — this container
  # runs inside OrbStack's own Linux VM and cannot see the real macOS
  # netinet/TCP stack itself (see scripts/tcp-exhaustion-textfile-exporter.sh
  # and INC-2026-09-07).
  # ============================================================
  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile'
    volumes:
      - /:/host:ro,rslave
      - ${TCP_TEXTFILE_DIR:-/Users/alex/monitoring/textfile-collector}:/textfile:ro
    pid: host

  # ============================================================
  # Postgres Exporter — PostgreSQL metrics
  # Connects to postgres in the core stack via localhost (host network mode)
  # ============================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: postgres-exporter
    restart: unless-stopped
    network_mode: host
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${MINI_POSTGRES_PASSWORD}@localhost:5432/postgres?sslmode=disable"

  # ============================================================
  # MongoDB Exporter — MongoDB metrics
  # Connects to mongo in the core stack via localhost (host network mode)
  # ============================================================
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    restart: unless-stopped
    network_mode: host
    command:
      - '--mongodb.uri=mongodb://root:${MONGO_PASSWORD}@localhost:27017/'
      - '--compatible-mode'
      - '--collect-all'

  # ============================================================
  # Technitium Exporter — DNS metrics (v2+ metric names; see mac-mini-dns Grafana dashboard)
  # Technitium runs on host network, accessed via localhost.
  # SERVER_LABEL must match the "Technitium server" variable on the dashboard (default: technitium).
  # ============================================================
  technitium-exporter:
    image: ghcr.io/guycalledseven/technitium-dns-prometheus-exporter@sha256:b6154a161987443d8ec6bbf272f0064bf825f109f5845acfa90d8ee580be542b
    container_name: technitium-exporter
    restart: unless-stopped
    network_mode: host
    environment:
      TECHNITIUM_BASE_URL: "http://localhost:5380"
      TECHNITIUM_TOKEN: "${TECHNITIUM_API_TOKEN}"
      SERVER_LABEL: "technitium"
      TECHNITIUM_STATS_RANGE: "LastHour"
      EXPORTER_PORT: "9105"

  # ============================================================
  # Blackbox Exporter — HTTP/HTTPS/TCP probes for external services
  # ============================================================
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    restart: unless-stopped
    network_mode: host
    # icmp module needs raw ICMP sockets (NET_RAW) — added for network-path
    # diagnostics after the 2026-08-26 Traefik-path outage. Docker's default
    # capability set already includes NET_RAW for root containers, so this is
    # currently a no-op in practice; kept explicit so the requirement doesn't
    # silently break if capabilities are ever hardened (cap_drop: ALL, etc.).
    cap_add:
      - NET_RAW
    volumes:
      - ${MONITORING_DIR:-.}/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
      - '--web.listen-address=:9115'

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

