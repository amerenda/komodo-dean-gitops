[[secret]]
name = "OPENAI_API_KEY"
bws_name = "litellm-master-key"

[[secret]]
name = "WEBUI_SECRET_KEY"
bws_name = "openwebui-dean-secret-key"

[[secret]]
name = "DATABASE_URL"
bws_name = "openwebui-dean-db-password"
format = "postgresql://openwebui:%s@host.docker.internal/openwebui"

[[secret]]
name = "MEM0_API_KEY"
bws_name = "mem0-admin-api-key"

[[secret]]
name = "PRAETOR_API_KEY"
bws_name = "praetor-api-key"

[[secret]]
name = "WEBUI_ADMIN_PASSWORD"
bws_name = "openwebui-dean-admin-password"

[[literal]]
name = "OPENAI_API_BASE_URL"
value = "https://litellm.amer.dev/v1"

[[literal]]
name = "WEBUI_ADMIN_EMAIL"
value = "alex@amer.dev"
