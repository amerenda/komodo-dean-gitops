# Ollama inference stack on Mac Mini — compose-managed Ollama.
# llm-agent removed 2026-06-29: LiteLLM (litellm.amer.dev) routes directly to :11434.
# Top-level name fixes the Docker Compose project name; matches Komodo stack id.
name: llm-mac-mini-m4

services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.21.0}
    pull_policy: always
    container_name: ollama
    restart: unless-stopped
    network_mode: host
    env_file:
      - ollama.env
      - ollama.ui.env
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Always-on serving config — single model loaded at a time for max speed and lowest latency
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ${OLLAMA_DATA_HOST_PATH:-/Users/alex/.ollama}:/root/.ollama
    # No `gpus` — Docker on macOS does not expose Metal to Linux containers.

# Pull the default always-on model on first deploy (one-shot, exits after).
  ollama-init:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.21.0}
    pull_policy: always
    container_name: ollama-init
    restart: "no"
    network_mode: host
    labels:
      komodo.skip:
    # Clear the default entrypoint (/ollama) so we can run shell commands instead
    entrypoint: []
    env_file:
      - ollama.env
    environment:
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:7b-instruct-q4_K_M}
    command: ["sh", "-c", "sleep 5 && echo \"Pulling $$OLLAMA_DEFAULT_MODEL...\" && OLLAMA_HOST=http://localhost:11434 ollama pull \"$$OLLAMA_DEFAULT_MODEL\" && echo \"$$OLLAMA_DEFAULT_MODEL ready.\""]

volumes: {}
