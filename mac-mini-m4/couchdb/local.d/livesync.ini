; Config required by the Obsidian "Self-hosted LiveSync" community plugin.
; Loaded from /opt/couchdb/etc/local.d/ so it layers on top of the
; container's generated local.ini instead of replacing it.
; Mirrors the settings the plugin's own setup wizard writes.

[couchdb]
single_node = true
max_document_size = 50000000

[chttpd]
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true

[httpd]
enable_cors = true
WWW-Authenticate = Basic realm="couchdb"

[cors]
origins = *
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
