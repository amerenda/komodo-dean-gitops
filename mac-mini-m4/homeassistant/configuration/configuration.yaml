# Loads default set of integrations. Do not remove.
default_config: {}

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Load UI-managed files for Automations & Scenes (so the UI keeps working)
automation: !include automations.yaml
automation manual: !include_dir_list automations
scene: !include scenes.yaml
group: !include groups.yaml

# Scripts managed as separate files under /config/scripts/*.yaml (dict merge)
script: !include_dir_merge_named scripts

# Persistent custom scene packs (All Rooms) — python_scripts/sl_custom_scenes_persist.py
python_script:

# Input helpers (split by domain)
input_boolean:  !include_dir_merge_named helpers/input_boolean/
input_datetime: !include_dir_merge_named helpers/input_datetime/
input_select:   !include_dir_merge_named helpers/input_select/
input_number:   !include_dir_merge_named helpers/input_number/
input_text:     !include_dir_merge_named helpers/input_text/


# Timers (smart lighting motion auto-off)
timer: !include_dir_merge_named helpers/timer/

# Occupancy — combined presence, independent of the person registry (which
# stays stale for Eirill until device_tracker.eirill_iphone_lan is linked to
# person.eirill in Settings > People). All presence automations key off
# binary_sensor.anyone_home so they work correctly regardless of that.
template:
  - binary_sensor:
      - name: "Eirill Present"
        unique_id: eirill_present
        device_class: presence
        state: >
          {{ is_state('device_tracker.eirill_iphone_lan', 'home')
             or is_state('device_tracker.eirill_iphone', 'home') }}
      - name: "Anyone Home"
        unique_id: anyone_home
        device_class: occupancy
        availability: >
          {{ not (is_state('person.alex_merenda', 'unavailable')
                  and is_state('device_tracker.eirill_iphone_lan', 'unavailable')) }}
        state: >
          {{ is_state('person.alex_merenda', 'home')
             or is_state('binary_sensor.eirill_present', 'on') }}
  # Smart Lighting v2 — template sensor for current time window
  - sensor:
      - name: "SL: Current Window"
        unique_id: sl_current_window
        icon: mdi:clock-time-four-outline
        state: >
          {% set day_names = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
          {% set today = day_names[now().weekday()] %}
          {% set profile = states('input_select.sl_profile_' ~ today) | default('weekday') %}
          {% set morning = states('input_datetime.sl_morning_start_' ~ profile) | default('06:00:00') %}
          {% set day_start = states('input_datetime.sl_day_start_' ~ profile) | default('09:00:00') %}
          {% set evening = states('input_datetime.sl_evening_start_' ~ profile) | default('17:00:00') %}
          {% set night = states('input_datetime.sl_night_start_' ~ profile) | default('22:00:00') %}
          {% set t = now().strftime('%H:%M:%S') %}
          {% if morning <= t < day_start %}morning
          {% elif day_start <= t < evening %}day
          {% elif evening <= t < night %}evening
          {% else %}night{% endif %}
        attributes:
          profile: >
            {% set day_names = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
            {% set today = day_names[now().weekday()] %}
            {{ states('input_select.sl_profile_' ~ today) | default('weekday') }}
          next_transition: >
            {% set day_names = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
            {% set today = day_names[now().weekday()] %}
            {% set profile = states('input_select.sl_profile_' ~ today) | default('weekday') %}
            {% set times = {
              'morning': states('input_datetime.sl_morning_start_' ~ profile),
              'day': states('input_datetime.sl_day_start_' ~ profile),
              'evening': states('input_datetime.sl_evening_start_' ~ profile),
              'night': states('input_datetime.sl_night_start_' ~ profile)
            } %}
            {% set t = now().strftime('%H:%M:%S') %}
            {% set upcoming = times | dictsort(by='value') | selectattr('1', 'gt', t) | first | default(none) %}
            {{ upcoming[1] if upcoming else times.values() | sort | first }}

zone:
  - name: Nearby
    latitude: 40.6834109
    longitude: -73.980568
    radius: 800
    icon: mdi:map-marker-radius
    passive: true

# Eirill's phone presence — direct ICMP check against her DHCP-reserved static
# IP (10.100.20.184 / MAC 6e:6e:a1:e4:cb:1c in UniFi). Added because the UniFi
# integration's device_tracker.eirill_iphone is bound to her OLD randomized MAC
# (96:6f:ea:3e:d2:9d) and never updated after the new static MAC took over —
# it silently reports not_home forever. This tracker is independent of that
# UniFi client-identity issue and self-heals on every HA restart since it's
# fully declared here (no UI linking required).
device_tracker:
  - platform: ping
    scan_interval: 60
    consider_home: 180
    hosts:
      eirill_iphone_lan: 10.100.20.184

homeassistant:
  media_dirs:
    pets: /config/www/pets
    intruders: /config/www/intruders

# Recorder retention — keeps SQLite DB small in backups. Purges history after 14 days, auto-repacks to reclaim disk space.
recorder:
  purge_keep_days: 14
  auto_purge: true
  auto_repack: true

# MQTT sensors — Z2M Smart Lighting sync status
mqtt:
  sensor:
    - name: "SL: Z2M Sync Status"
      unique_id: sl_z2m_sync_status
      state_topic: "zigbee2mqtt/sl/status"
      value_template: >-
        {% set s = value_json.status | default('unknown') %}
        {% if s is match('window_') %}
          {{ s[7:] }}
        {% else %}
          {{ s }}
        {% endif %}
      json_attributes_topic: "zigbee2mqtt/sl/status"
      json_attributes_template: "{{ value_json | tojson }}"
      icon: mdi:sync

# Lovelace: storage mode + YAML dashboards
lovelace:
  mode: storage
  dashboards:
    dean-dashboard:
      mode: yaml
      title: Dean
      icon: mdi:home
      show_in_sidebar: true
      filename: dashboards/views/dean.yaml
    subway-dashboard:
      mode: yaml
      title: Subway
      icon: mdi:subway-variant
      show_in_sidebar: true
      filename: dashboards/views/subway.yaml
    security-dashboard:
      mode: yaml
      title: Security
      icon: mdi:cctv
      show_in_sidebar: true
      filename: dashboards/views/security.yaml
    uni-dashboard:
      mode: yaml
      title: Uni
      icon: mdi:cat
      show_in_sidebar: true
      filename: dashboards/views/uni.yaml
    smart-lighting-dashboard:
      mode: yaml
      title: Smart Lighting
      icon: mdi:lightbulb-auto
      show_in_sidebar: true
      filename: dashboards/views/smart_lighting.yaml
    home-away-dashboard:
      mode: yaml
      title: Home & Away
      icon: mdi:home-account
      show_in_sidebar: true
      filename: dashboards/views/home_away.yaml

# MQTT — configured via HA UI (Settings > Integrations > MQTT)
# Broker: 127.0.0.1:1883 (Mosquitto on host network)

# HTTP reverse proxy
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.100.20.0/24
    - 10.43.0.0/16
    - 10.42.0.0/16
    - 127.0.0.1

# Prometheus metrics endpoint for Grafana dashboards
prometheus:
  namespace: homeassistant
  filter:
    include_domains:
      - light
      - switch
      - binary_sensor
      - sensor
      - automation
      - script
      - scene
      - input_boolean
      - input_select
      - input_number
      - input_datetime
      - input_text
      - person
      - device_tracker
      - event

# Media sources - expose local media folders to Media dashboard
media_source: {}

# Logger — suppress known-noisy integration spam
logger:
  default: warning
  logs:
    pychromecast.socket_client: critical
    custom_components.gtfs_realtime.coordinator: critical

# Shell commands
shell_command:
  cleanup_old_photos: 'find /config/www/pets -name "*.jpg" -mtime +30 -delete && find /config/www/intruders -name "*.jpg" -mtime +30 -delete'
  subway_status_update: 'sh /config/scripts_shell/subway_status.sh'
