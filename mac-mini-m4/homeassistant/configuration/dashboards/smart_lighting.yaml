  # Switch Config Tab
  # ════════════════════════════════════════════════════════════
  - title: Switches
    path: switches
    icon: mdi:light-switch
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_select.sl_room_selector
            name: Room

      - type: markdown
        content: |
          **Button 1 (top):** Short = toggle on/off, Long = power off all
          **Button 2:** Short = brightness up, Long = brightness max
          **Button 3:** Short = brightness down, Long = brightness min
          **Button 4 (bottom):** Short = cycle scenes (all window scenes + any named custom scene), Long = *(bedroom: SexySex scene; all other rooms: toggles all lights on/off)*. Any button can be reassigned below, including to a specific named custom scene ("Scene: Custom 1/2/3").

      # ── Living Room ─────────────────────────────────────────
