title: Smart Lighting
views:
  - title: Controls
    path: schedule
    icon: mdi:lightbulb-auto
    cards:
      # ── Top Bar ────────────────────────────────────────────
      - type: entities
        entities:
          - entity: input_boolean.sl_enabled
            name: Smart Lighting
          - entity: sensor.sl_current_window
            name: Current Window
          - entity: input_select.sl_house_mode
            name: House Mode
          - entity: sensor.sl_z2m_sync_status
            name: Z2M Sync

      - type: button
        name: Debug — read all light attrs
        icon: mdi:bug-outline
        show_state: false
        tap_action:
          action: call-service
          service: script.sl_debug_save_read
          data:
            room: all

      # ── Schedule (collapsible) ─────────────────────────────
      - type: entities
        entities:
          - entity: input_boolean.sl_show_schedule
            name: Edit Schedule
            icon: mdi:clock-edit-outline

      - type: conditional
        conditions:
          - entity: input_boolean.sl_show_schedule
            state: "on"
        card:
          type: vertical-stack
          cards:
            # Day → Profile assignment
            - type: entities
              title: Day Profiles
              show_header_toggle: false
              entities:
                - entity: input_select.sl_profile_monday
                  name: Monday
                - entity: input_select.sl_profile_tuesday
                  name: Tuesday
                - entity: input_select.sl_profile_wednesday
                  name: Wednesday
                - entity: input_select.sl_profile_thursday
                  name: Thursday
                - entity: input_select.sl_profile_friday
                  name: Friday
                - entity: input_select.sl_profile_saturday
                  name: Saturday
                - entity: input_select.sl_profile_sunday
                  name: Sunday
            # Profile schedules
            - type: entities
              title: "Weekday Profile"
              show_header_toggle: false
              entities:
                - entity: input_datetime.sl_morning_start_weekday
                  name: Morning
                - entity: input_datetime.sl_day_start_weekday
                  name: Day
                - entity: input_datetime.sl_evening_start_weekday
                  name: Evening
                - entity: input_datetime.sl_night_start_weekday
                  name: Night
            - type: entities
              title: "Friday Profile"
              show_header_toggle: false
              entities:
                - entity: input_datetime.sl_morning_start_friday
                  name: Morning
                - entity: input_datetime.sl_day_start_friday
                  name: Day
                - entity: input_datetime.sl_evening_start_friday
                  name: Evening
                - entity: input_datetime.sl_night_start_friday
                  name: Night
            - type: entities
              title: "Saturday Profile"
              show_header_toggle: false
              entities:
                - entity: input_datetime.sl_morning_start_saturday
                  name: Morning
                - entity: input_datetime.sl_day_start_saturday
                  name: Day
                - entity: input_datetime.sl_evening_start_saturday
                  name: Evening
                - entity: input_datetime.sl_night_start_saturday
                  name: Night
            - type: entities
              title: "Sunday Profile"
              show_header_toggle: false
              entities:
                - entity: input_datetime.sl_morning_start_sunday
                  name: Morning
                - entity: input_datetime.sl_day_start_sunday
                  name: Day
                - entity: input_datetime.sl_evening_start_sunday
                  name: Evening
                - entity: input_datetime.sl_night_start_sunday
                  name: Night

      # ── Room Selector ──────────────────────────────────────
      - type: entities
        title: Room Settings
        entities:
          - entity: input_select.sl_room_selector
            name: Room

      - type: button
        name: Apply Changes (Push Config to Z2M)
        icon: mdi:upload-network-outline
        show_state: false
        tap_action:
          action: call-service
          service: script.sl_push_config

      # ── Room Settings: Bathroom ────────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Bathroom"
        card:
          type: entities
          show_header_toggle: false
          entities:
            - type: section
              label: "Motion (Sleep Mode)"
            - entity: input_boolean.sl_bathroom_motion_night
              name: Allow wall-switch power-on at night
            - type: section
              label: Settings
            - entity: input_boolean.sl_bathroom_smart_power_on
              name: Smart Wall Switch
            - entity: input_boolean.sl_bathroom_auto_transition
              name: Auto Transition
            - entity: input_boolean.sl_bathroom_smooth_transition
              name: Smooth Transition
            - entity: input_number.sl_bathroom_smooth_transition_duration
              name: Transition Duration (min)

      # ── Room Settings: Bedroom ─────────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Bedroom"
        card:
          type: entities
          show_header_toggle: false
          entities:
            - type: section
              label: "Motion (Sleep Mode)"
            - entity: input_boolean.sl_bedroom_motion_night
              name: Allow wall-switch power-on at night
            - type: section
              label: Settings
            - entity: input_boolean.sl_bedroom_smart_power_on
              name: Smart Wall Switch
            - entity: input_boolean.sl_bedroom_auto_transition
              name: Auto Transition
            - entity: input_boolean.sl_bedroom_smooth_transition
              name: Smooth Transition
            - entity: input_number.sl_bedroom_smooth_transition_duration
              name: Transition Duration (min)


      # ── Room Settings: Hallway ─────────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Hallway"
        card:
          type: entities
          show_header_toggle: false
          entities:
            - type: section
              label: "Motion (Sleep Mode)"
            - entity: input_boolean.sl_hallway_motion_night
              name: Allow wall-switch power-on at night
            - type: section
              label: Settings
            - entity: input_boolean.sl_hallway_smart_power_on
              name: Smart Wall Switch
            - entity: input_boolean.sl_hallway_auto_transition
              name: Auto Transition
            - entity: input_boolean.sl_hallway_smooth_transition
              name: Smooth Transition
            - entity: input_number.sl_hallway_smooth_transition_duration
              name: Transition Duration (min)

      # ── Room Settings: Kitchen ─────────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Kitchen"
        card:
          type: entities
          show_header_toggle: false
          entities:
            - type: section
              label: "Motion (Sleep Mode)"
            - entity: input_boolean.sl_kitchen_motion_night
              name: Allow wall-switch power-on at night
            - type: section
              label: Settings
            - entity: input_boolean.sl_kitchen_smart_power_on
              name: Smart Wall Switch
            - entity: input_boolean.sl_kitchen_auto_transition
              name: Auto Transition
            - entity: input_boolean.sl_kitchen_smooth_transition
              name: Smooth Transition
            - entity: input_number.sl_kitchen_smooth_transition_duration
              name: Transition Duration (min)

      # ── Room Settings: Living Room ─────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Living Room"
        card:
          type: entities
          show_header_toggle: false
          entities:
            - type: section
              label: "Motion (Sleep Mode)"
            - entity: input_boolean.sl_living_room_motion_night
              name: Allow wall-switch power-on at night
            - type: section
              label: Settings
            - entity: input_boolean.sl_living_room_smart_power_on
              name: Smart Wall Switch
            - entity: input_boolean.sl_living_room_auto_transition
              name: Auto Transition
            - entity: input_boolean.sl_living_room_smooth_transition
              name: Smooth Transition
            - entity: input_number.sl_living_room_smooth_transition_duration
              name: Transition Duration (min)

  # ════════════════════════════════════════════════════════════
  # Scene Editor Tab
  # ════════════════════════════════════════════════════════════
  - title: Scene Editor
    path: scenes
    icon: mdi:palette
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_select.sl_room_selector
            name: Room

      # ── Living Room ─────────────────────────────────────────
      - type: conditional
        conditions:
          - entity: input_select.sl_room_selector
            state: "Living Room"
        card:
          type: vertical-stack
          cards:
            - type: custom:hue-like-light-card
              entity: light.living_room_1
              title: Light
              showSwitch: false
              slider: default
              onClickAction: hue-screen
              offClickAction: hue-screen
            - type: custom:mushroom-title-card
              title: Load Stored Scene
              subtitle: Applies stored values to lights as a starting point
            - type: horizontal-stack
              cards:
                - type: button
                  name: Morning
                  icon: mdi:weather-sunset-up
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_scene
                    data:
                      room: living_room
                      window: morning
                - type: button
                  name: Day
                  icon: mdi:weather-sunny
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_scene
                    data:
                      room: living_room
                      window: day
                - type: button
                  name: Evening
                  icon: mdi:weather-sunset-down
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_scene
                    data:
                      room: living_room
                      window: evening
                - type: button
                  name: Night
                  icon: mdi:weather-night
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_scene
                    data:
                      room: living_room
                      window: night
            - type: custom:mushroom-title-card
              title: Save Current State
            - type: horizontal-stack
              cards:
                - type: button
                  name: As Morning
                  icon: mdi:content-save
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_save_current_as_scene
                    data:
                      room: living_room
                      window: morning
                - type: button
                  name: As Day
                  icon: mdi:content-save
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_save_current_as_scene
                    data:
                      room: living_room
                      window: day
                - type: button
                  name: As Evening
                  icon: mdi:content-save
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_save_current_as_scene
                    data:
                      room: living_room
                      window: evening
                - type: button
                  name: As Night
                  icon: mdi:content-save
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_save_current_as_scene
                    data:
                      room: living_room
                      window: night
            - type: custom:mushroom-title-card
              title: Custom Scenes (Button 4 Cycle)
              subtitle: Adjust each light above how you want (on/off, brightness, color — each bulb can differ), name a slot, then "Save From Current Lights". Automatically added to the Button 4 cycle. Clear the name to remove it.
            - type: entities
              show_header_toggle: false
              entities:
                - entity: input_text.sl_living_room_custom1_name
                  name: "Slot 1 Name"
            - type: horizontal-stack
              cards:
                - type: button
                  name: Load Slot 1
                  icon: mdi:play
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_custom_scene
                    data:
                      room: living_room
                      slot: custom1
                - type: button
                  name: "Save Slot 1 From Current Lights"
                  icon: mdi:content-save
                  show_state: false
                  tap_action:
                    action: call-service
                    service: python_script.sl_save_custom_scene_lights
                    data:
                      room: living_room
                      slot: custom1
            - type: entities
              show_header_toggle: false
              entities:
                - entity: input_text.sl_living_room_custom2_name
                  name: "Slot 2 Name"
            - type: horizontal-stack
              cards:
                - type: button
                  name: Load Slot 2
                  icon: mdi:play
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_custom_scene
                    data:
                      room: living_room
                      slot: custom2
                - type: button
                  name: "Save Slot 2 From Current Lights"
                  icon: mdi:content-save
                  show_state: false
                  tap_action:
                    action: call-service
                    service: python_script.sl_save_custom_scene_lights
                    data:
                      room: living_room
                      slot: custom2
            - type: entities
              show_header_toggle: false
              entities:
                - entity: input_text.sl_living_room_custom3_name
                  name: "Slot 3 Name"
            - type: horizontal-stack
              cards:
                - type: button
                  name: Load Slot 3
                  icon: mdi:play
                  show_state: false
                  tap_action:
                    action: call-service
                    service: script.sl_preview_custom_scene
                    data:
                      room: living_room
                      slot: custom3
                - type: button
                  name: "Save Slot 3 From Current Lights"
                  icon: mdi:content-save
                  show_state: false
                  tap_action:
                    action: call-service
                    service: python_script.sl_save_custom_scene_lights
                    data:
                      room: living_room
                      slot: custom3
            - type: entities
              show_header_toggle: false
              entities:
                - entity: input_text.sl_custom_scene_name
                  name: Custom Name
            - type: button
              name: Save as Custom
              icon: mdi:creation
              show_state: false
              tap_action:
                action: call-service
                service: script.sl_save_current_as_scene
                data:
                  room: living_room
                  window: "{{ states('input_text.sl_custom_scene_name') | lower | replace(' ', '_') }}"
            - type: markdown
              content: >
                **Wall switch power-on only.** Captures current brightness/color as the bulb's
                mains-power-on default — what the bulb wakes to when a wall switch cuts and
                restores power. Has no effect on Hue dimmer button-1 (handled by Z2M scene recall)
                or on scene windows.
            - type: button
              name: Save as Firmware Default (Wall Switch)
              icon: mdi:electric-switch
              show_state: false
              tap_action:
                action: call-service
                service: script.set_bulb_defaults
                data:
                  room: living_room

