sl_bedroom_sexysex:
  alias: "SL: Bedroom — SexySex Scene"
  description: "bedroom_1 light pink, bedroom_2 light purple (~17% brightness), lamp_1 off"
  mode: single
  sequence:
    - parallel:
        - service: light.turn_on
          target:
            entity_id: light.bedroom_1
          data:
            brightness: 45
            xy_color: [0.37, 0.20]
            transition: 1
        - service: light.turn_on
          target:
            entity_id: light.bedroom_2
          data:
            brightness: 45
            xy_color: [0.26, 0.11]
            transition: 1
        - service: light.turn_off
          target:
            entity_id: light.lamp_1
