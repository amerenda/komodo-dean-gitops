camera_privacy_on:
  alias: "Security: Cameras Off (Privacy On)"
  description: "Confirm LED off, then enable privacy mode. Aborts per-camera if LED cannot be confirmed off."
  mode: single
  sequence:
    # ── Bedroom Camera ──
    - service: light.turn_off
      target:
        entity_id: light.bedroom_status_led
    - wait_template: "{{ is_state('light.bedroom_status_led', 'off') }}"
      timeout: "00:00:15"
      continue_on_timeout: true
    - if:
        - condition: state
          entity_id: light.bedroom_status_led
          state: "off"
      then:
        - service: switch.turn_on
          target:
            entity_id: switch.bedroom_privacy_mode
        - wait_template: "{{ is_state('switch.bedroom_privacy_mode', 'on') }}"
          timeout: "00:00:15"
          continue_on_timeout: true
      else:
        - service: notify.mobile_app_pixel_9_pro_xl
          data:
            title: "Camera Privacy Warning"
            message: "Bedroom LED did not confirm off — privacy mode NOT enabled for bedroom"

    # ── Living Room Camera ──
    - service: light.turn_off
      target:
        entity_id: light.living_room_status_led
    - wait_template: "{{ is_state('light.living_room_status_led', 'off') }}"
      timeout: "00:00:15"
      continue_on_timeout: true
    - if:
        - condition: state
          entity_id: light.living_room_status_led
          state: "off"
      then:
        - service: switch.turn_on
          target:
            entity_id: switch.living_room_privacy_mode
        - wait_template: "{{ is_state('switch.living_room_privacy_mode', 'on') }}"
          timeout: "00:00:15"
          continue_on_timeout: true
      else:
        - service: notify.mobile_app_pixel_9_pro_xl
          data:
            title: "Camera Privacy Warning"
            message: "Living Room LED did not confirm off — privacy mode NOT enabled for living room"

camera_privacy_off:
  alias: "Security: Cameras On (Privacy Off)"
  description: "Disable privacy mode (verified), then turn on LEDs"
  mode: single
  sequence:
    # ── Bedroom Camera ──
    - service: switch.turn_off
      target:
        entity_id: switch.bedroom_privacy_mode
    - wait_template: "{{ is_state('switch.bedroom_privacy_mode', 'off') }}"
      timeout: "00:00:15"
      continue_on_timeout: true
    - service: light.turn_on
      target:
        entity_id: light.bedroom_status_led

    # ── Living Room Camera ──
    - service: switch.turn_off
      target:
        entity_id: switch.living_room_privacy_mode
    - wait_template: "{{ is_state('switch.living_room_privacy_mode', 'off') }}"
      timeout: "00:00:15"
      continue_on_timeout: true
    - service: light.turn_on
      target:
        entity_id: light.living_room_status_led
