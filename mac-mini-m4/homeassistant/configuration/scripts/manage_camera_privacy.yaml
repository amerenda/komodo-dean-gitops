camera_privacy_on:
  alias: "Security: Cameras Off (Privacy On)"
  description: >
    Turn off the status LED, then enable privacy mode.
    2026-08-25: dropped the "LED did not confirm off" warning + the gate
    that skipped enabling privacy mode without it. Once a Reolink camera's
    privacy mode is on, the camera can't be queried at all — its LED and
    camera entities go `unavailable` (that's expected, not a fault) — so
    on every run after the first, this wait_template could never confirm
    "off" and the warning fired every single time regardless of the LED's
    real state. Privacy mode is still enabled unconditionally below; the
    LED turn-off is now fire-and-forget.
  mode: single
  sequence:
    # ── Bedroom Camera ──
    - service: light.turn_off
      continue_on_error: true
      target:
        entity_id: light.bedroom_status_led
    - service: switch.turn_on
      continue_on_error: true
      target:
        entity_id: switch.bedroom_privacy_mode
    - wait_template: "{{ is_state('switch.bedroom_privacy_mode', 'on') }}"
      timeout: "00:00:15"
      continue_on_timeout: true

    # ── Living Room Camera ──
    - service: light.turn_off
      continue_on_error: true
      target:
        entity_id: light.living_room_status_led
    - service: switch.turn_on
      continue_on_error: true
      target:
        entity_id: switch.living_room_privacy_mode
    - wait_template: "{{ is_state('switch.living_room_privacy_mode', 'on') }}"
      timeout: "00:00:15"
      continue_on_timeout: true

camera_privacy_off:
  alias: "Security: Cameras On (Privacy Off)"
  description: "Disable privacy mode (verified), then turn on LEDs"
  mode: single
  sequence:
    # ── Bedroom Camera ──
    - service: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.bedroom_privacy_mode
    - wait_template: "{{ is_state('switch.bedroom_privacy_mode', 'off') }}"
      timeout: "00:00:15"
      continue_on_timeout: true
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.bedroom_status_led

    # ── Living Room Camera ──
    - service: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.living_room_privacy_mode
    - wait_template: "{{ is_state('switch.living_room_privacy_mode', 'off') }}"
      timeout: "00:00:15"
      continue_on_timeout: true
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.living_room_status_led
