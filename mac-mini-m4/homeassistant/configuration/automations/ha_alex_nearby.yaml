alias: "HA: Alex Approaching Home"
id: ha_alex_nearby
description: >
  When Alex enters the ~800m nearby zone: pre-condition AC to home temp so the
  apartment is comfortable on arrival.
mode: single
trigger:
  - platform: zone
    entity_id: person.alex_merenda
    zone: zone.nearby
    event: enter
condition:
  - condition: state
    entity_id: input_boolean.ha_automation_enabled
    state: "on"
  - condition: state
    entity_id: input_boolean.ha_ac_home
    state: "on"
action:
  - service: climate.set_temperature
    target:
      entity_id: climate.151732605151026_climate
    data:
      temperature: "{{ states('input_number.ha_ac_home_temp') | float }}"
