# Smart Lighting v3 — Custom scene names + per-light snapshots (Button 4 Cycle Scenes, per room)
# 3 fixed slots per room. Empty name = slot unused — excluded from the Cycle Scenes list.
# The _lights field holds a compact JSON snapshot of each light's own state/brightness/
# color, captured live by sl_save_custom_scene_lights.py (Scene Editor tab) — not hand-edited.

