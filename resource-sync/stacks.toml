# ── OpenWebUI: Chat interface — claw.amer.dev ─────────────────────────────

[[stack]]
name = "openwebui"
description = "OpenWebUI chat interface — always-up on mac-mini-m4, proxied via bot.amer.dev"
tags = ["mac-mini"]
deploy = true
[stack.config]
server = "mac-mini-m4"
repo = "amerenda/komodo-dean-gitops"
branch = "main"
file_paths = ["mac-mini-m4/openwebui/compose.yaml"]
git_account = "amerenda"
project_name = "openwebui"
[stack.config.pre_deploy]
command = """
export BWS_ACCESS_TOKEN=$(cat /run/secrets/bws-access-token)
mkdir -p /Users/alex/komodo/openwebui/data
_BWSL=$(bws secret list --access-token "$BWS_ACCESS_TOKEN")
printf 'OPENAI_API_BASE_URL=https://litellm.amer.dev/v1\n' > mac-mini-m4/openwebui/.env
printf 'OPENAI_API_KEY=%s\n' "$(echo "$_BWSL" | jq -r '.[] | select(.key == "litellm-master-key") | .value')" >> mac-mini-m4/openwebui/.env
printf 'WEBUI_SECRET_KEY=%s\n' "$(echo "$_BWSL" | jq -r '.[] | select(.key == "openwebui-dean-secret-key") | .value')" >> mac-mini-m4/openwebui/.env
printf 'DATABASE_URL=postgresql://openwebui:%s@host.docker.internal/openwebui\n' "$(echo "$_BWSL" | jq -r '.[] | select(.key == "openwebui-dean-db-password") | .value')" >> mac-mini-m4/openwebui/.env
printf 'MEM0_API_KEY=%s\n' "$(echo "$_BWSL" | jq -r '.[] | select(.key == "mem0-admin-api-key") | .value')" >> mac-mini-m4/openwebui/.env
printf 'PRAETOR_API_KEY=%s\n' "$(echo "$_BWSL" | jq -r '.[] | select(.key == "praetor-api-key") | .value')" >> mac-mini-m4/openwebui/.env
printf 'WEBUI_ADMIN_EMAIL=alex@amer.dev\n' >> mac-mini-m4/openwebui/.env
printf 'WEBUI_ADMIN_PASSWORD=%s\n' "$(echo "$_BWSL" | jq -r '.[] | select(.key == "openwebui-dean-admin-password") | .value')" >> mac-mini-m4/openwebui/.env
"""

