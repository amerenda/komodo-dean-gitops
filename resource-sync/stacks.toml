# ── Monitoring: Prometheus, Node Exporter, DB Exporters ────────────────────

[[stack]]
name = "monitoring"
description = "Prometheus, Grafana, node-exporter, postgres/mongo/technitium exporters"
tags = ["mac-mini"]
deploy = true
[stack.config]
server = "mac-mini-m4"
repo = "amerenda/komodo-dean-gitops"
branch = "main"
file_paths = ["mac-mini-m4/monitoring/compose.yaml"]
git_account = "amerenda"
project_name = "monitoring"
# The stack's GitHub deploy webhook fires on every push but is a no-op without
# this — Komodo only auto-runs ResourceSync (updates the Stack's own config,
# e.g. pre_deploy) on push, it does not auto-redeploy the running containers
# unless force_deploy is set.
webhook_force_deploy = true
[stack.config.pre_deploy]
command = """
export BWS_ACCESS_TOKEN=$(cat /run/secrets/bws-access-token)
printf 'MINI_POSTGRES_PASSWORD=%s\n' "$(bws secret get a280e465-8813-4b48-9972-b4210149cb60 --access-token "$BWS_ACCESS_TOKEN" | jq -r .value)" > mac-mini-m4/monitoring/.env
printf 'MONGO_PASSWORD=%s\n' "$(bws secret get d0213758-1881-4d35-8fd2-b39d015cb7b9 --access-token "$BWS_ACCESS_TOKEN" | jq -r .value)" >> mac-mini-m4/monitoring/.env
printf 'TECHNITIUM_API_TOKEN=%s\n' "$(bws secret get 4645ac46-3955-4e6e-8558-b434015613a7 --access-token "$BWS_ACCESS_TOKEN" | jq -r .value)" >> mac-mini-m4/monitoring/.env
printf 'GRAFANA_ADMIN_USER=admin\n' >> mac-mini-m4/monitoring/.env
printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "$(bws secret get 9a2f2c00-0cc9-4aac-91da-b43d00f980d1 --access-token "$BWS_ACCESS_TOKEN" | jq -r .value)" >> mac-mini-m4/monitoring/.env
test -f mac-mini-m4/monitoring/compose.yaml && test -d mac-mini-m4/monitoring/grafana/dashboards || exit 1
printf 'MONITORING_DIR=%s/mac-mini-m4/monitoring\n' "$(pwd)" >> mac-mini-m4/monitoring/.env
bws secret get c7ccdb87-b04e-428e-bbcf-b4340156edf6 --access-token "$BWS_ACCESS_TOKEN" | jq -r .value > mac-mini-m4/monitoring/ha-token
PUSHOVER_USER_KEY=$(bws secret get 16d79345-5721-4173-9e14-b49a00ce1cb3 --access-token "$BWS_ACCESS_TOKEN" | jq -r .value)
PUSHOVER_TOKEN=$(bws secret get 45c01263-f879-4cb7-ad01-b49a00d0b2d0 --access-token "$BWS_ACCESS_TOKEN" | jq -r .value)
printf 'global:\n' > mac-mini-m4/monitoring/alertmanager.yml
printf '  resolve_timeout: 5m\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf 'route:\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '  receiver: '"'"'pushover'"'"'\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '  group_by: ['"'"'alertname'"'"', '"'"'stack'"'"']\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '  group_wait: 30s\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '  group_interval: 5m\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '  repeat_interval: 6h\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf 'receivers:\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '  - name: '"'"'pushover'"'"'\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '    pushover_configs:\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '      - user_key: '"'"'%s'"'"'\n' "$PUSHOVER_USER_KEY" >> mac-mini-m4/monitoring/alertmanager.yml
printf '        token: '"'"'%s'"'"'\n' "$PUSHOVER_TOKEN" >> mac-mini-m4/monitoring/alertmanager.yml
printf '        title: '"'"'{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'"'"'\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '        message: |-\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '          {{ .CommonAnnotations.summary }}\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '          {{ .CommonAnnotations.description }}\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '        url: '"'"'https://alertmanager.amer.dev'"'"'\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '        priority: '"'"'0'"'"'\n' >> mac-mini-m4/monitoring/alertmanager.yml
printf '        send_resolved: true\n' >> mac-mini-m4/monitoring/alertmanager.yml
curl -sf -X POST http://10.100.20.18:9093/-/reload >/dev/null 2>&1 || true
"""

