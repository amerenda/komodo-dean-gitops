# ── LLM + GPU Exporter: Ollama + AMD GPU metrics (Arch Linux) ────────────────
# GPU exporter (amdgpu-collector + amdgpu-exporter) is co-located in the
# llm-archlinux compose so both Ollama and GPU metrics share one Komodo stack.

[[stack]]
name = "llm-archlinux"
description = "Ollama on Arch Linux — AMD ROCm, RX 9070 XT, LiteLLM routes directly to :11434"
tags = ["archlinux"]
deploy = true
[stack.config]
server = "archlinux"
repo = "amerenda/komodo-dean-gitops"
branch = "main"
git_account = "amerenda"
file_paths = ["archlinux/llm/compose.yaml"]
project_name = "llm-archlinux"
ignore_services = ["ollama-init", "smoke-test"]
[stack.config.pre_deploy]
command = """
export BWS_ACCESS_TOKEN=$(cat /run/secrets/bws-access-token)
bash archlinux/llm/pre-deploy.sh
"""
[stack.config.post_deploy]
command = """
OLLAMA_DEFAULT_MODEL=$(grep -E '^OLLAMA_DEFAULT_MODEL=' archlinux/llm/gitops.env 2>/dev/null | cut -d= -f2 | tr -d '"')
OLLAMA_DEFAULT_MODEL="${OLLAMA_DEFAULT_MODEL:-qwen3:14b}"
echo "Confirming Ollama model is pulled: ${OLLAMA_DEFAULT_MODEL}"
docker exec ollama ollama pull "${OLLAMA_DEFAULT_MODEL}"
"""

# ── murderbot Periphery server (Debian) ───────────────────────────────────
# Periphery is bootstrapped on the host by Ansible
# (playbooks/infrastructure/setup-debian-komodo.yml in ansible-playbooks).

[[server]]
name = "murderbot"
description = "Debian home server (10.100.20.19) — media-server, llm-murderbot stacks"
tags = ["murderbot"]
[server.config]
address = "https://10.100.20.19:8120"
enabled = true
# Intentionally empty: Core uses its global passkey (KOMODO_PASSKEY_FILE →
# komodo-dean-passkey on the Mac Mini), which must match PERIPHERY_PASSKEYS on
# the Periphery host. Do NOT use [[KOMODO_PERIPHERY_PASSKEY]] here — Core can persist the
# placeholder literally and you get "Invalid passkey" even when the Variable is correct.
passkey = ""

[[server]]
name = "archlinux"
description = "Arch Linux Periphery (10.100.20.25)"
tags = ["archlinux"]
[server.config]
address = "https://10.100.20.25:8120"
