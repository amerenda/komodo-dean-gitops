# llm-manager stack on Arch Linux — agent + compose-managed Ollama (AMD / ROCm).
# Top-level name fixes the Docker Compose project name; matches Komodo stack id.
#
# ollama-init is the "init container" pattern for Docker Compose: it starts after ollama
# is healthy and pulls the default model so LiteLLM never hits a cold 404 on first request.
name: llm-archlinux

services:
  ollama:
    image: ollama/ollama:${OLLAMA_AMD_IMAGE_TAG:-0.21.0-rocm}
    pull_policy: always
    container_name: ollama
    restart: unless-stopped
    dns:
      - ${DOCKER_DNS_1:-1.1.1.1}
      - ${DOCKER_DNS_2:-8.8.8.8}
    ports:
      - "11434:11434"
    env_file:
      - ollama.env
      - ollama.ui.env
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /mnt/models
      # HSA_OVERRIDE_GFX_VERSION must NOT be set to empty string — ROCm silently fails GPU
      # detection if this var is present with an empty value. Only set via ollama.env if needed.
      # Always-on serving config — single model loaded at a time for max speed and lowest latency
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Keep model loaded indefinitely — prevents 5-minute unload causing cold-start latency on first request
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ${OLLAMA_DATA_HOST_PATH:-/home/alex/.ollama}:/root/.ollama
      - ${OLLAMA_MODELS_HOST_PATH:-/mnt/storage/models}:/mnt/models
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-985}"
      - "${RENDER_GID:-989}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/version"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Init-container: pulls the default model after ollama is healthy.
  # restart: "no" means it exits cleanly after pulling; Komodo ignores it via komodo.skip.
  ollama-init:
    image: ollama/ollama:${OLLAMA_AMD_IMAGE_TAG:-0.21.0-rocm}
    pull_policy: always
    container_name: ollama-init
    restart: "no"
    labels:
      komodo.skip:
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_DEFAULT_MODEL:-qwen3:14b}"]
    volumes:
      - ${OLLAMA_MODELS_HOST_PATH:-/mnt/storage/models}:/mnt/models

