# llm-manager stack on Arch Linux — agent + compose-managed Ollama (AMD / ROCm).
# Top-level name fixes the Docker Compose project name; matches Komodo stack id.
#
# ollama-init is the "init container" pattern for Docker Compose: it starts after ollama
# is healthy and pulls the default model so LiteLLM never hits a cold 404 on first request.
name: llm-archlinux

services:
  ollama:
    image: ollama/ollama:${OLLAMA_AMD_IMAGE_TAG:-0.21.0-rocm}
    pull_policy: always
    container_name: ollama
    restart: unless-stopped
    dns:
      - ${DOCKER_DNS_1:-1.1.1.1}
      - ${DOCKER_DNS_2:-8.8.8.8}
    ports:
      - "11434:11434"
    env_file:
      - ollama.env
      - ollama.ui.env
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /mnt/models
      # HSA_OVERRIDE_GFX_VERSION must NOT be set to empty string — ROCm silently fails GPU
      # detection if this var is present with an empty value. Only set via ollama.env if needed.
      # Always-on serving config — single model loaded at a time for max speed and lowest latency
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Keep model loaded indefinitely — prevents 5-minute unload causing cold-start latency on first request
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ${OLLAMA_DATA_HOST_PATH:-/home/alex/.ollama}:/root/.ollama
      - ${OLLAMA_MODELS_HOST_PATH:-/mnt/storage/models}:/mnt/models
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-985}"
      - "${RENDER_GID:-989}"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Init-container: pulls the default model after ollama is healthy.
  # restart: "no" means it exits cleanly after pulling; Komodo ignores it via komodo.skip.
  ollama-init:
    image: ollama/ollama:${OLLAMA_AMD_IMAGE_TAG:-0.21.0-rocm}
    pull_policy: always
    container_name: ollama-init
    restart: "no"
    labels:
      komodo.skip:
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_DEFAULT_MODEL:-qwen3:14b}"]
    volumes:
      - ${OLLAMA_MODELS_HOST_PATH:-/mnt/storage/models}:/mnt/models

  # ── AMD GPU metrics exporter (formerly gpu-exporter-archlinux stack) ────────
  # Reads GPU metrics from sysfs (no ROCm required). Prometheus scrapes port 9101.
  amdgpu-collector:
    image: python:3.12-alpine
    restart: unless-stopped
    volumes:
      - textfile:/textfile
      - /sys/class/drm:/sys/class/drm:ro
    command:
      - python3
      - -c
      - |
        import os, time, glob

        def read_int(path, default=0):
            try:
                return int(open(path).read().strip())
            except Exception:
                return default

        while True:
            cards = sorted(glob.glob('/sys/class/drm/card*/device/gpu_busy_percent'))
            metrics = []
            for idx, busy_path in enumerate(cards):
                d = os.path.dirname(busy_path)
                util = read_int(busy_path)
                vram_used = read_int(f'{d}/mem_info_vram_used')
                vram_total = read_int(f'{d}/mem_info_vram_total')
                hwmons = sorted(glob.glob(f'{d}/hwmon/hwmon*'))
                hwmon = hwmons[0] if hwmons else None
                temp = read_int(f'{hwmon}/temp1_input') / 1000.0 if hwmon else 0
                power = read_int(f'{hwmon}/power1_average') / 1_000_000.0 if hwmon else 0
                lbl = f'gpu="{idx}"'
                metrics.append((lbl, util, vram_used, vram_total, temp, power))

            if metrics:
                lines = [
                    '# HELP amdgpu_busy_percent GPU utilization percent',
                    '# TYPE amdgpu_busy_percent gauge',
                ]
                for lbl, util, *_ in metrics:
                    lines.append(f'amdgpu_busy_percent{{{lbl}}} {util}')
                lines += [
                    '# HELP amdgpu_vram_used_bytes VRAM used bytes',
                    '# TYPE amdgpu_vram_used_bytes gauge',
                ]
                for lbl, _, vram_used, *_ in metrics:
                    lines.append(f'amdgpu_vram_used_bytes{{{lbl}}} {vram_used}')
                lines += [
                    '# HELP amdgpu_vram_total_bytes VRAM total bytes',
                    '# TYPE amdgpu_vram_total_bytes gauge',
                ]
                for lbl, _, _u, vram_total, *_ in metrics:
                    lines.append(f'amdgpu_vram_total_bytes{{{lbl}}} {vram_total}')
                lines += [
                    '# HELP amdgpu_temperature_celsius GPU junction temperature celsius',
                    '# TYPE amdgpu_temperature_celsius gauge',
                ]
                for lbl, _u, _vu, _vt, temp, _ in metrics:
                    lines.append(f'amdgpu_temperature_celsius{{{lbl}}} {temp:.1f}')
                lines += [
                    '# HELP amdgpu_power_watts GPU power draw watts',
                    '# TYPE amdgpu_power_watts gauge',
                ]
                for lbl, _u, _vu, _vt, _t, power in metrics:
                    lines.append(f'amdgpu_power_watts{{{lbl}}} {power:.2f}')

                tmp = '/textfile/amdgpu.prom.tmp'
                with open(tmp, 'w') as f:
                    f.write('\n'.join(lines) + '\n')
                os.rename(tmp, '/textfile/amdgpu.prom')

            time.sleep(15)

  amdgpu-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: amdgpu-exporter
    restart: unless-stopped
    ports:
      - "9101:9101"
    command:
      - --web.listen-address=:9101
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/textfile
    volumes:
      - textfile:/textfile:ro
    depends_on:
      - amdgpu-collector

volumes:
  textfile:

