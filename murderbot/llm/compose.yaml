# vLLM inference stack on murderbot — NVIDIA RTX PRO 4000 Blackwell (SM_120a)
# Serves nvidia/Qwen3.6-27B-NVFP4 on port 8088; LiteLLM routes to http://10.100.20.19:8088
#
# Model is loaded from HF Hub on first start (cached at HF_HOME=/mnt/models/hf-cache).
# start_period=1200s covers download (~14 GB) + load + torch.compile on cold start.
#
# Key flags:
#   --quantization modelopt  : ModelOpt NVFP4 checkpoint format
#   --served-model-name      : multiple names preserve LiteLLM backward compat
#   --kv-cache-dtype fp8     : 2x KV capacity vs bf16 on the same VRAM budget
#   --swap-space 0           : disables CPU KV cache swap — keeps all inference on GPU
#   --gpu-memory-utilization 0.95: ~13.5 GB weights + 10 GB headroom for KV cache
name: llm-murderbot

services:
  vllm-server:
    image: vllm/vllm-openai:v0.24.0-cu129
    container_name: vllm-server
    restart: unless-stopped
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      HF_HOME: /mnt/models/hf-cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command:
      - "--model"
      - "nvidia/Qwen3.6-27B-NVFP4"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8088"
      - "--quantization"
      - "modelopt"
      - "--reasoning-parser"
      - "qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
      - "--served-model-name"
      - "qwen3-35b"
      - "--served-model-name"
      - "qwen36-35b"
      - "--served-model-name"
      - "qwen36-27b"
      - "--max-model-len"
      - "32768"
      - "--max-num-seqs"
      - "4"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--kv-cache-dtype"
      - "fp8"
      - "--no-enable-log-requests"
    ports:
      - "8088:8088"
    volumes:
      - /mnt/storage/models:/mnt/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s
