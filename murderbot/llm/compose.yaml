# llama.cpp inference stack on murderbot — NVIDIA RTX PRO 4000 Blackwell (SM_120a)
# Serves Qwen3.6-35B-A3B on port 8088; LiteLLM routes qwen3-35b → 10.100.20.19:8088
name: llm-murderbot

services:
  llama-server:
    image: amerenda/murderbot-llm:${LLAMA_IMAGE_TAG:-latest}
    container_name: llama-server
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      MODEL: /mnt/models/llms/qwen36/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      NGL: "${NGL:-99}"
      CTX: "${CTX:-131072}"
      PORT: "8088"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8088:8088"
    volumes:
      - /mnt/storage/models:/mnt/models:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
