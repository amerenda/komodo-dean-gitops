# llama.cpp inference stack on murderbot — NVIDIA RTX PRO 4000 Blackwell (SM_120a)
#
# SWITCHABLE MODEL PROFILES (2026-08-19, extended 2026-08-20): this file
# defines three Docker Compose *profiles* -- qwen36, qwen38, qwen3coder --
# all serving under the same --alias murderbot-primary on port 8088. Which
# profile actually runs is selected by the Komodo Variable
# MURDERBOT_LLM_PROFILE, read by murderbot/llm/pre-deploy.sh and written into
# COMPOSE_PROFILES in llm/.env BEFORE `docker compose up` runs -- NOT by
# editing this file. Switching models (or switching this GPU to the image-gen
# stack in murderbot/img/) is a runtime action via murderbot/gpu-switcher/,
# not a gitops PR. See that service for the switch mechanism itself.
#
# This file (the profile definitions, flags, quant choices) is still the
# place to make actual configuration CHANGES to any profile -- adding a
# fourth profile, bumping a quant, changing context size. Only the *selection*
# of which profile runs right now lives outside git.
#
# qwen36/qwen38 share the same chat template (froggeric's v22.2 covers
# Qwen3.5/3.6/3.8 in one file). qwen3coder is a different-enough architecture
# generation (predates the 3.5/3.6/3.8 hybrid-attention line, not covered by
# froggeric's repo) that it uses its own GGUF-baked chat template instead --
# see the qwen3coder section below for why that's safe here.
#
# ── qwen38 profile: Qwen3.8-27B-GGUF+MTP ─────────────────────────────────────
# Model: ggml-org/Qwen3.8-27B-Q4_K_M.gguf (18.97GB) + mtp-Qwen3.8-27B-Q4_0.gguf
# (1.68GB) separate MTP draft head, loaded via --spec-draft-model
# (this architecture ships MTP as a standalone file, unlike qwen36 below).
#
# llama.cpp build note: a real, documented bug exists on older llama.cpp CUDA
# builds where Qwen3.8's DeltaNet/Gated-DeltaNet layers produce silently
# corrupted output (loads fine, full speed, no error, just garbage text) --
# see ggml-org/llama.cpp discussion #27164. Confirmed coherent output
# directly on the b10502 build in murderbot/llm-llamacpp/Dockerfile before
# ever deploying this profile, not assumed safe from the tag being new.
#
# Context length -- empirically determined, NOT calculated (KV-cache math for
# hybrid attention architectures is not linear and is easy to get wrong):
#   16384  -> loads cleanly, ~3.4 GiB headroom (very safe, low context)
#   65536  -> loads cleanly, survived a REAL 58,912-token request (90% of
#             this ceiling) -- but only 101 MiB headroom remained after,
#             uncomfortably close to the edge for production stability
#   49152  -> loads cleanly, survived a REAL 43,419-token request (88% of
#             this ceiling) with 1.19 GiB headroom remaining -- THE CHOSEN
#             VALUE
#
# Throughput -- measured, not assumed to match the qwen36 profile below: that
# model is a 35B **MoE** (only ~3B params active per token). This is a
# **dense** 27B model -- full param count active every token, inherently
# more expensive per token regardless of engine or MTP. Measured: ~40 tok/s
# sustained (700-token real generation), MTP draft acceptance ~63-100%.
#
# ── qwen36 profile: Qwen3.6-35B-A3B-MTP-GGUF ─────────────────────────────────
# Model: huihui-ai/Huihui-Qwen3.6-35B-A3B-abliterated-MTP-GGUF (Q4_K,
# 20.22 GiB, MTP tensors baked into the single file -- --spec-type draft-mtp
# alone finds them, no --spec-draft-model needed, unlike qwen38 above).
# True weight-level abliteration (huihui-ai), not just prompt-based
# uncensoring -- unlike the qwen38 profile, which has no abliterated NVFP4/
# GGUF quant available yet (see k3s-dean-gitops litellm configmap).
#
# Context length 98,304 and the -ngl/-fa/-np/--spec-draft-n-max values below
# are carried over from this profile's original 2026-07-23 deployment
# (~120-140 tok/s with MTP, ~850 MiB headroom at 98,304 verified under a real
# 96,640-token request at the time) -- re-verify these numbers empirically on
# the current build/template combo before fully trusting them again; the
# llama.cpp version and chat template have both changed since this profile
# last actually ran (see the PR that reintroduced this profile for the
# revalidation results).
#
# ── qwen3coder profile: Qwen3-Coder-30B-A3B-Instruct ─────────────────────────
# Model: unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF, Q4_K_M (18.56GB). Same
# architectural class as qwen36 (sparse MoE, ~3.3B active params/token out of
# 30.5B total) but a DIFFERENT, older architecture generation than
# qwen36/qwen38 -- predates the Qwen3.5/3.6/3.8 hybrid-attention line, so none
# of that line's assumptions were trusted here without reverifying:
#
#   - No MTP: this model has no MTP draft head (baked-in or separate) --
#     don't add --spec-type/--spec-draft-model, there's nothing to find.
#     Doesn't matter in practice: measured 155-157 tok/s WITHOUT speculative
#     decoding, matching/beating the MTP-boosted qwen36 profile above, because
#     the MoE active-param count is what actually drives llama.cpp throughput
#     on this card, not MTP specifically.
#
#   - Chat template: uses the model's own GGUF-baked template (--jinja, no
#     --chat-template-file), NOT froggeric's fixed template -- froggeric's
#     Qwen-Fixed-Chat-Templates repo explicitly scopes itself to "Qwen 3.5,
#     3.6 & 3.8" and does not cover this architecture. Qwen3-Coder had a real,
#     now-fixed tool-calling bug in its shipped chat template (XML leaking
#     into content instead of clean JSON tool_calls -- see ggml-org/llama.cpp
#     issue #15012 and Unsloth's Aug 2025 "we fixed tool-calling for
#     Qwen3-Coder" post). Verified directly against this exact GGUF
#     (unsloth's build, downloaded 2026-08-20): tool_choice=required returns
#     finish_reason=tool_calls with a clean JSON arguments string and zero XML
#     in content -- the fix is baked into this download's chat_template
#     metadata, froggeric fallback was not needed.
#
#   - Quant tier: Q5_K_M (21.73GB) and even 32,768 context left only 19 MiB
#     free on this 24GB card -- effectively zero safety margin, would have
#     OOM'd on the first real large request (measured directly, not assumed).
#     Q5_K_S (21.08GB) was not separately downloaded/tested -- it only saves
#     0.65GB over Q5_K_M, nowhere near enough to close a ~2.4GB deficit, so
#     spending another 21GB download to confirm the obvious wasn't worth it.
#     Went straight to Q4_K_M (18.56GB), which is the shipped config.
#
#   - Context length -- empirically determined:
#       65536 -> Q4_K_M: FAILS to load -- "cudaMalloc failed: out of memory"
#                during compute-buffer allocation. This model's per-token KV/
#                compute cost is higher than qwen38's (a dense 27B model) at
#                this context length, despite qwen3coder having fewer active
#                params -- don't extrapolate context ceilings across model
#                families even within "MoE" as a category.
#       49152  -> Q4_K_M: loads cleanly, survived a REAL 42,020-token request
#                (85% of this ceiling) with 1.43 GiB headroom remaining --
#                THE CHOSEN VALUE. Notably the same context size that ended up
#                working for qwen38 (a different model/quant) -- coincidence,
#                not a shortcut taken (65536 was tried and measured to fail
#                before landing here).
#
# Key flags shared by all three profiles:
#   -ngl 99 / -ngld 99          : offload all layers to GPU, main + draft
#                                  model (99 exceeds any real layer count --
#                                  llama.cpp clamps to actual depth -- zero
#                                  CPU/disk fallback)
#   -fa on                      : flash attention, required at this model size
#   -np 1                       : single concurrent slot -- this box serves
#                                  one caller at a time
#   --jinja                     : required for tool-calling on all profiles.
#                                  qwen36/qwen38 also pass
#                                  --chat-template-file for froggeric's v22.2
#                                  fixed template (documented tool-calling/
#                                  agentic-loop fixes for that architecture
#                                  line). qwen3coder omits that flag and uses
#                                  its own GGUF-baked template instead (see
#                                  above -- froggeric's repo doesn't cover
#                                  this architecture, and the model's own
#                                  template was verified clean).
#   --reasoning-format deepseek : (qwen36/qwen38 only) extracts <think> blocks
#                                  into the API's reasoning_content field
#                                  instead of leaking them into visible
#                                  content. Not passed for qwen3coder -- an
#                                  "-Instruct" (non-thinking) variant, and
#                                  untested with this flag, so left out rather
#                                  than assumed safe.
#   --reasoning-preserve        : (qwen36/qwen38 only) 100% prefix KV-cache
#                                  retention across turns that include
#                                  reasoning. Same "untested for qwen3coder,
#                                  don't assume" reasoning as above.
#   --metrics                   : Prometheus metrics for the smoke test and monitoring
name: llm-murderbot

x-llama-common: &llama-common
  build:
    context: ../llm-llamacpp
    dockerfile: Dockerfile
  image: llama-cpp-blackwell:b10502
  pull_policy: build
  container_name: llama-server
  restart: unless-stopped
  mem_swappiness: 0
  ipc: host
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  ports:
    - "8088:8088"
  volumes:
    - /mnt/storage/models:/mnt/models
    - ../llm-llamacpp/chat_template.jinja:/chat_template.jinja:ro
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
    interval: 30s
    timeout: 10s
    retries: 5
    # Cold start: reading a ~20GB GGUF from disk + full GPU upload + KV cache
    # allocation. Generous margin here for a busier host or a cold page cache.
    start_period: 600s

services:
  llama-server-qwen38:
    <<: *llama-common
    profiles: ["qwen38"]
    command:
      - "-m"
      - "/mnt/models/hf-cache/hub/models--ggml-org--Qwen3.8-27B-GGUF/snapshots/0669b98607d47046c7c2b3f801011d54a08cfccf/Qwen3.8-27B-Q4_K_M.gguf"
      - "--spec-draft-model"
      - "/mnt/models/hf-cache/hub/models--ggml-org--Qwen3.8-27B-GGUF/snapshots/0669b98607d47046c7c2b3f801011d54a08cfccf/mtp-Qwen3.8-27B-Q4_0.gguf"
      - "--spec-type"
      - "draft-mtp"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8088"
      - "--alias"
      - "murderbot-primary"
      - "-ngl"
      - "99"
      - "-ngld"
      - "99"
      - "-fa"
      - "on"
      - "-np"
      - "1"
      - "--spec-draft-n-max"
      - "3"
      - "--spec-draft-n-min"
      - "1"
      - "--jinja"
      - "--chat-template-file"
      - "/chat_template.jinja"
      - "--reasoning-format"
      - "deepseek"
      - "--reasoning-preserve"
      - "-c"
      - "49152"
      - "--metrics"

  llama-server-qwen36:
    <<: *llama-common
    profiles: ["qwen36"]
    command:
      - "-m"
      - "/mnt/models/hf/Huihui-Qwen3.6-35B-A3B-abliterated-MTP-GGUF/Huihui-Qwen3.6-35B-A3B-abliterated-ggml-model-Q4_K.gguf"
      - "--spec-type"
      - "draft-mtp"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8088"
      - "--alias"
      - "murderbot-primary"
      - "-ngl"
      - "99"
      - "-fa"
      - "on"
      - "-np"
      - "1"
      - "--spec-draft-n-max"
      - "6"
      - "--jinja"
      - "--chat-template-file"
      - "/chat_template.jinja"
      - "--reasoning-format"
      - "deepseek"
      - "--reasoning-preserve"
      - "-c"
      - "98304"
      - "--metrics"

  llama-server-qwen3coder:
    <<: *llama-common
    profiles: ["qwen3coder"]
    command:
      - "-m"
      - "/mnt/models/hf-cache/hub/models--unsloth--Qwen3-Coder-30B-A3B-Instruct-GGUF/snapshots/b17cb02dd882d5b6ab62fc777ad2995f19668350/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8088"
      - "--alias"
      - "murderbot-primary"
      - "-ngl"
      - "99"
      - "-fa"
      - "on"
      - "-np"
      - "1"
      - "--jinja"
      - "-c"
      - "49152"
      - "--metrics"

  # Smoke test — runs once after llama-server is healthy, validates the deployment.
  # Checks: model loaded, tool calling (JSON not XML), SearXNG search, synthesis
  #         after tool turn, token throughput. Works against any profile since
  #         all three serve under --alias murderbot-primary.
  # Logs: docker logs llm-murderbot-smoke-test
  # Exit code: docker inspect llm-murderbot-smoke-test --format='{{.State.ExitCode}}'
  smoke-test:
    image: python:3.12-alpine
    container_name: llm-murderbot-smoke-test
    restart: "no"
    profiles: ["qwen38", "qwen36", "qwen3coder"]
    labels:
      komodo.skip:
    depends_on:
      llama-server-qwen38:
        condition: service_started
        required: false
      llama-server-qwen36:
        condition: service_started
        required: false
      llama-server-qwen3coder:
        condition: service_started
        required: false
    environment:
      LLAMA_URL: "http://llama-server:8088"
      SEARXNG_URL: "https://searxng.amer.dev"
      EXPECTED_MODEL_SUBSTR: "murderbot-primary"
    volumes:
      - ./smoke-test.py:/smoke-test.py:ro
    command: ["python3", "/smoke-test.py"]
