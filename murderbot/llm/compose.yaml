# vLLM inference stack on murderbot — NVIDIA RTX PRO 4000 Blackwell (SM_120a)
# Serves nvidia/Qwen3.6-27B-NVFP4 on port 8088; LiteLLM routes to http://10.100.20.19:8088
#
# Model is loaded from HF Hub on first start (cached at HF_HOME=/mnt/models/hf-cache/hub).
# start_period=1200s covers cold start (model load + profiling pass ~3-4 min).
#
# Key flags:
#   --quantization modelopt      : ModelOpt NVFP4 checkpoint format
#   --enforce-eager              : required — CUDA graph capture exhausts VRAM after 20 GB model load
#   --kv-cache-dtype fp8         : 2x KV capacity vs bf16; valid on SM120 Blackwell
#   --gpu-memory-utilization 0.97: 23.28 GB budget → 0.73 GiB KV after 22.55 GB profiling peak
#   --max-model-len 16384        : 0.73 GiB KV fits 16K ctx; 32K needs 1.15 GiB (insufficient)
#
# NOTE: AEON-7/Qwen3.6-27B-AEON-Ultimate-Uncensored-Multimodal-NVFP4-MTP (uncensored) does NOT fit.
# That model is 27 GB on disk (includes vision encoder + MTP head) vs 21 GB for this text-only model.
# OOMs at 97% GPU utilization (23.42 GiB). Requires a text-only uncensored NVFP4 variant.
name: llm-murderbot

services:
  vllm-server:
    image: vllm/vllm-openai:v0.24.0-cu129
    container_name: vllm-server
    restart: unless-stopped
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      HF_HOME: /mnt/models/hf-cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command:
      - "--model"
      - "nvidia/Qwen3.6-27B-NVFP4"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8088"
      - "--quantization"
      - "modelopt"
      - "--reasoning-parser"
      - "qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_xml"
      - "--served-model-name"
      - "qwen36-27b"
      - "--max-model-len"
      - "16384"
      - "--max-num-seqs"
      - "4"
      - "--gpu-memory-utilization"
      - "0.97"
      - "--kv-cache-dtype"
      - "fp8"
      - "--enforce-eager"
      - "--no-enable-log-requests"
    ports:
      - "8088:8088"
    volumes:
      - /mnt/storage/models:/mnt/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s

  # Pre-downloads the uncensored NVFP4 benchmark model to HF cache.
  # Runs once after deploy (restart: "no"). Does NOT replace the production model.
  # Model: AEON-7/Qwen3.6-27B-AEON-Ultimate-Uncensored-Multimodal-NVFP4-MTP
  #   - 27 GB on disk (vision encoder + MTP head + base) — does NOT fit in 24 GB VRAM alone
  #   - modelopt NVFP4 format; available for offline benchmarking on a second GPU
  #   - Abliterated, uncensored
  uncensored-model-init:
    image: vllm/vllm-openai:v0.24.0-cu129
    container_name: llm-murderbot-uncensored-init
    restart: "no"
    labels:
      komodo.skip:
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      HF_HOME: /mnt/models/hf-cache
    volumes:
      - /mnt/storage/models:/mnt/models
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        python3 -c "
        from huggingface_hub import snapshot_download
        import os
        print('Downloading AEON uncensored NVFP4-MTP model...')
        snapshot_download(
            'AEON-7/Qwen3.6-27B-AEON-Ultimate-Uncensored-Multimodal-NVFP4-MTP',
            cache_dir=os.environ['HF_HOME'],
        )
        print('Download complete.')
        "

  # Smoke test — runs once after vllm-server is healthy, validates the deployment.
  # Checks: model loaded, GPU KV cache, tool calling (JSON not XML), SearXNG search,
  #         synthesis after tool turn, token throughput.
  # Logs: docker logs llm-murderbot-smoke-test
  # Exit code: docker inspect llm-murderbot-smoke-test --format='{{.State.ExitCode}}'
  smoke-test:
    image: python:3.12-alpine
    container_name: llm-murderbot-smoke-test
    restart: "no"
    labels:
      komodo.skip:
    depends_on:
      vllm-server:
        condition: service_healthy
    environment:
      VLLM_URL: "http://vllm-server:8088"
      SEARXNG_URL: "https://searxng.amer.dev"
      EXPECTED_MODEL: "qwen36-27b"
      HF_HOME: /mnt/models/hf-cache
      UNCENSORED_MODEL_ID: "AEON-7/Qwen3.6-27B-AEON-Ultimate-Uncensored-Multimodal-NVFP4-MTP"
    volumes:
      - ./smoke-test.py:/smoke-test.py:ro
      - /mnt/storage/models:/mnt/models:ro
    command: ["python3", "/smoke-test.py"]
