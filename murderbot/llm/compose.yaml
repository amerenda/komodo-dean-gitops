# vLLM inference stack on murderbot — NVIDIA RTX PRO 4000 Blackwell (SM_120a)
# Serves nvidia/Qwen3.6-27B-NVFP4 on port 8088; LiteLLM routes to http://10.100.20.19:8088
#
# Model is loaded from HF Hub on first start (cached at HF_HOME=/mnt/models/hf-cache).
# start_period=1200s covers cold start (model load + profiling pass ~3-4 min).
#
# Key flags:
#   --quantization modelopt      : ModelOpt NVFP4 checkpoint format
#   --enforce-eager              : required — CUDA graph capture exhausts VRAM after 20 GB model load
#   --kv-cache-dtype fp8         : 2x KV capacity vs bf16; valid on SM120 Blackwell
#   --gpu-memory-utilization 0.97: 23.28 GB budget → 0.73 GiB KV after 22.55 GB profiling peak
#   --max-model-len 16384        : 0.73 GiB KV fits 16K ctx; 32K needs 1.15 GiB (insufficient)
name: llm-murderbot

services:
  vllm-server:
    image: vllm/vllm-openai:v0.24.0-cu129
    container_name: vllm-server
    restart: unless-stopped
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      HF_HOME: /mnt/models/hf-cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command:
      - "--model"
      - "nvidia/Qwen3.6-27B-NVFP4"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8088"
      - "--quantization"
      - "modelopt"
      - "--reasoning-parser"
      - "qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_xml"
      - "--served-model-name"
      - "qwen36-27b"
      - "--max-model-len"
      - "16384"
      - "--max-num-seqs"
      - "4"
      - "--gpu-memory-utilization"
      - "0.97"
      - "--kv-cache-dtype"
      - "fp8"
      - "--enforce-eager"
      - "--no-enable-log-requests"
    ports:
      - "8088:8088"
    volumes:
      - /mnt/storage/models:/mnt/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s
