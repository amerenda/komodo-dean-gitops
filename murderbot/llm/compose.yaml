# vLLM inference stack on murderbot — NVIDIA RTX PRO 4000 Blackwell (SM_120a)
# Serves sakamakismile/Huihui-Qwen3.6-27B-abliterated-NVFP4-TEXT-MTP on port 8088
# LiteLLM routes to http://10.100.20.19:8088 as model alias "qwen36-27b"
#
# Model is loaded from HF Hub on first start (cached at HF_HOME=/mnt/models/hf-cache/hub).
# start_period=1200s covers cold start (model load + profiling pass ~3-4 min).
#
# Why this model:
#   - Text-only NVFP4: 19.64 GB on disk vs 21.94 GB for nvidia/Qwen3.6-27B-NVFP4
#   - Abliterated (huihui-ai): refusal circuitry removed; polite behavior controlled via system prompt
#   - Both "polished assistant" (murderbot-v2-custom) and "unrestricted" (murderbot-v2-uncensored-custom)
#     OWU presets run on the same model with different system prompts
#   - modelopt NVFP4 + Blackwell tags: same quantization format as nvidia official model
#   - Prior attempts with AEON-7 (27 GB) OOMed at 0.97 GPU util — text-only variant resolves this
#
# Key flags:
#   --quantization modelopt      : ModelOpt NVFP4 checkpoint format
#   --trust-remote-code          : required for sakamakismile model config loading
#   --enforce-eager              : required — CUDA graph capture exhausts VRAM after model load
#   --kv-cache-dtype fp8         : 2x KV capacity vs bf16; valid on SM120 Blackwell
#   --gpu-memory-utilization 0.97: 23.28 GB budget → ~3 GiB KV after ~20 GB profiling peak
#   --max-model-len 16384        : conservative; ~3 GiB KV headroom allows up to ~24K if needed
name: llm-murderbot

services:
  vllm-server:
    image: vllm/vllm-openai:v0.24.0-cu129
    container_name: vllm-server
    restart: unless-stopped
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      HF_HOME: /mnt/models/hf-cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command:
      - "--model"
      - "sakamakismile/Huihui-Qwen3.6-27B-abliterated-NVFP4-TEXT-MTP"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8088"
      - "--quantization"
      - "modelopt"
      - "--trust-remote-code"
      - "--reasoning-parser"
      - "qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_xml"
      - "--served-model-name"
      - "qwen36-27b"
      - "--max-model-len"
      - "16384"
      - "--max-num-seqs"
      - "4"
      - "--gpu-memory-utilization"
      - "0.97"
      - "--kv-cache-dtype"
      - "fp8"
      - "--enforce-eager"
      - "--no-enable-log-requests"
    ports:
      - "8088:8088"
    volumes:
      - /mnt/storage/models:/mnt/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s

  # Smoke test — runs once after vllm-server is healthy, validates the deployment.
  # Checks: model loaded, GPU KV cache, tool calling (JSON not XML), SearXNG search,
  #         synthesis after tool turn, token throughput.
  # Logs: docker logs llm-murderbot-smoke-test
  # Exit code: docker inspect llm-murderbot-smoke-test --format='{{.State.ExitCode}}'
  smoke-test:
    image: python:3.12-alpine
    container_name: llm-murderbot-smoke-test
    restart: "no"
    labels:
      komodo.skip:
    depends_on:
      vllm-server:
        condition: service_healthy
    environment:
      VLLM_URL: "http://vllm-server:8088"
      SEARXNG_URL: "https://searxng.amer.dev"
      EXPECTED_MODEL: "qwen36-27b"
      HF_HOME: /mnt/models/hf-cache
      UNCENSORED_MODEL_ID: "sakamakismile/Huihui-Qwen3.6-27B-abliterated-NVFP4-TEXT-MTP"
    volumes:
      - ./smoke-test.py:/smoke-test.py:ro
      - /mnt/storage/models:/mnt/models:ro
    command: ["python3", "/smoke-test.py"]
