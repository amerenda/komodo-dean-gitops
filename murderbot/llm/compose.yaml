# llama.cpp inference stack on murderbot — NVIDIA RTX PRO 4000 Blackwell (SM_120a)
# Serves Qwen3.6-35B-A3B on port 8088; LiteLLM routes qwen3-35b → 10.100.20.19:8088
#
# MODEL can be overridden at runtime by the model-switcher sidecar (port 8091).
# Default is the main Qwen3.6 Unsloth UD-Q4_K_XL; switch to qwen36-unrestricted via OWU.
name: llm-murderbot

services:
  llama-server:
    image: amerenda/murderbot-llm:${LLAMA_IMAGE_TAG:-latest}
    container_name: llama-server
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      MODEL: ${MODEL:-/mnt/models/llms/qwen36/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf}
      NGL: "${NGL:-99}"
      CTX: "${CTX:-131072}"
      PORT: "8088"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8088:8088"
    volumes:
      - /mnt/storage/models:/mnt/models:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  model-switcher:
    image: python:3.12-slim
    container_name: model-switcher
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./model_switcher.py:/app/model_switcher.py:ro
    environment:
      SWITCH_PSK: "${SWITCH_PSK}"
      LLAMA_IMAGE: "amerenda/murderbot-llm:${LLAMA_IMAGE_TAG:-latest}"
      MODEL_VOLUME: "/mnt/storage/models:/mnt/models:ro"
    command: >
      sh -c "pip install fastapi uvicorn docker --quiet && python /app/model_switcher.py"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
