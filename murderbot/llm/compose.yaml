# vLLM inference stack on murderbot — NVIDIA RTX PRO 4000 Blackwell (SM_120a)
# Serves sakamakismile/Qwen3.8-27B-MTP-NVFP4 on port 8088
# LiteLLM routes to http://10.100.20.19:8088 as model alias "qwen38-27b"
#
# Migration note (2026-08-19): replaces llama.cpp+Qwen3.6-35B-A3B with vLLM
# serving the newly-released Qwen3.8-27B dense model in NVFP4. Model upgrade,
# not an engine regression: Qwen3.8 ships with vLLM-native NVFP4 support, so
# vLLM is viable again for a model this size. Every flag below was arrived at
# by actually loading this model on this card and hitting real failures first
# -- not copied from a vendor doc. See "How these flags were found" below.
#
# Model: sakamakismile/Qwen3.8-27B-MTP-NVFP4 (20.6 GB on disk)
#   - Qwen/Qwen3.8-27B (dense, hybrid DeltaNet+full-attention, Qwen3-VL vision
#     tower, native MTP draft head) quantized NVFP4 W4A4 group-16 via
#     llm-compressor. lm_head, vision tower, conv1d, and MTP head kept in bf16;
#     everything else NVFP4. 55.6 GB bf16 -> 20.6 GB.
#   - Chosen over the two other public NVFP4 quants after checking actual file
#     sizes via the HF API (not blog claims, which ranged 20.6/23.4/24.6/26.4 GB
#     for what's nominally "the same" quant): the official vLLM-recipe model
#     (Inferact/Qwen3.8-27B-NVFP4) is 26.4 GB, does not fit a 24GB card at all;
#     unsloth/Qwen3.8-27B-NVFP4 is 23.4 GB, fits weights-only with under 1GB
#     left for anything else -- not viable. This one is 20.6 GB and, per the
#     load-time accounting below, is the one that actually works here.
#   - NOT abliterated. Unlike the Qwen3.6-27B setup this replaces, there is no
#     production-grade weight-level-abliterated NVFP4 quant of Qwen3.8-27B yet
#     (huihui-ai's Huihui-Qwen3.8-27B-abliterated exists but is bf16-only and
#     self-described as a "crude proof-of-concept," and nobody has quantized it
#     to NVFP4). The murderbot-uncensored-* OWU presets on this model rely on
#     system-prompt-based uncensoring only until a mature abliterated NVFP4
#     quant exists -- a real capability change from the previous setup, not an
#     oversight. Revisit if/when one ships.
#
# Tool calling — yes, this needs the same XML-aware handling Qwen3.6 needed:
#   --tool-call-parser qwen3_xml is required (generic "hermes" leaves raw XML
#   in content on this architecture, same class of bug Qwen3.6 had -- see
#   praetor repo PR #189). This is both the model publisher's own recipe and
#   what the previous working Qwen3.6-27B compose.yaml in this repo used. No
#   custom chat template file needed (unlike the llama.cpp path) -- vLLM's
#   qwen3_xml parser works directly against the model's stock chat template.
#
# MTP speculative decoding — NOT enabled, deliberately:
#   The checkpoint has an MTP draft head baked in (--speculative-config
#   '{"method":"qwen3_5_mtp","num_speculative_tokens":3}' is the publisher's
#   documented way to use it), but loading it added ~3.4 GiB to the resident
#   footprint (21.08 GiB vs 17.62 GiB without) -- confirmed by diffing
#   "Model loading took X GiB" between two otherwise-identical loads on this
#   card. That extra weight left no room for a usable KV cache: even at
#   --gpu-memory-utilization 0.99 the process OOM'd on a fixed ~2.37 GiB
#   post-load allocation before ever reaching KV cache sizing. Without MTP,
#   the same card loads cleanly with 3.95-4.89 GiB left for KV cache. Traded
#   MTP's throughput win (would have been large, per the publisher's own
#   TP=4/128k benchmarks) for a model that reliably fits and serves real
#   context on this single 24GB card. Revisit if a lighter-weight MTP
#   integration or a bigger card shows up.
#
# GPU sizing — empirically determined under real requests, NOT calculated or
# trusted from "server started successfully" alone (a lesson learned the hard
# way on both the previous vLLM setup and the llama.cpp migration -- KV-cache
# math for this hybrid architecture is not linear and is easy to get wrong):
#   --gpu-memory-utilization 0.99 -> loads, reports a KV cache budget, but
#       OOMs on the very first real chat-completion request (only ~360 MiB
#       free at runtime once actual generation buffers were needed).
#       "Available KV cache memory" being reported is not proof of fitting.
#   --gpu-memory-utilization 0.95 -> loads, and SURVIVES real requests:
#       tested a 1500-token generation (finish_reason=length, coherent, GPU
#       had 913 MiB free after) and a real 28,172-token prompt at
#       max-model-len=32768 (HTTP 200, coherent summary, 637 MiB free after).
#       THE CHOSEN VALUE.
#   --max-model-len 32768 -> KV pool reported 99,517 tokens at this setting
#       (3.04x concurrency for a full-length single request) -- comfortable
#       margin verified with the 28K-token real-prompt test above, not just
#       trusted from the startup log.
#
# How these flags were found (the debugging trail, so it isn't repeated):
#   1. --enforce-eager is required. Without it, CUDA graph capture after
#      loading a ~21 GiB model tries to grab ~2.37 GiB more and OOMs before
#      the server ever starts (matches a previously-resolved incident with
#      the older nvidia/Qwen3.6-27B-NVFP4 model on this same card).
#   2. --skip-mm-profiling and --limit-mm-per-prompt '{"image":0,"video":0}'
#      are both set for text-only serving (this model's vision tower is
#      unused here; OWU/OpenHands/praetor only send text). Belt-and-suspenders
#      with the fixes above, doesn't hurt.
#   3. PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True materially reduced
#      allocator fragmentation waste -- the fixed post-load allocation that
#      OOM'd went from needing ~2.37 GiB free to needing ~20 MiB free once
#      this was set (still not enough on its own without also dropping MTP,
#      but part of what got the final config across the line).
#   4. --quantization is NOT set -- compressed-tensors is auto-detected from
#      the checkpoint's quantization_config.
#
# Zero CPU offload confirmed (hard requirement for this deployment): no
# --cpu-offload-gb flag is set (default 0), nvidia-smi showed the full model
# resident in GPU memory (23,890 MiB used, matching weights+KV), and the
# server's own /metrics reported num_cpu_blocks="None" -- zero CPU-side KV
# blocks too. Verified directly, not inferred from flags alone.
name: llm-murderbot

services:
  vllm-server:
    image: vllm/vllm-openai:qwen38-cu129
    container_name: vllm-server
    restart: unless-stopped
    mem_swappiness: 0
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      HF_HOME: /mnt/models/hf-cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command:
      - "--model"
      - "sakamakismile/Qwen3.8-27B-MTP-NVFP4"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8088"
      - "--served-model-name"
      - "qwen38-27b"
      - "--trust-remote-code"
      - "--tensor-parallel-size"
      - "1"
      - "--reasoning-parser"
      - "qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_xml"
      - "--limit-mm-per-prompt"
      - '{"image":0,"video":0}'
      - "--skip-mm-profiling"
      - "--max-model-len"
      - "32768"
      - "--max-num-seqs"
      - "1"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--kv-cache-dtype"
      - "fp8"
      - "--enforce-eager"
      - "--default-chat-template-kwargs"
      - '{"enable_thinking": false}'
      - "--no-enable-log-requests"
    ports:
      - "8088:8088"
    volumes:
      - /mnt/storage/models:/mnt/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Cold start: ~20GB checkpoint download (first run only, cached after)
      # + load + KV cache allocation took ~75-90s once cached in testing;
      # generous margin here for a cold HF cache or a busier host.
      start_period: 1200s

  # Smoke test — runs once after vllm-server is healthy, validates the deployment.
  # Checks: model loaded, GPU KV cache, tool calling (JSON not XML), SearXNG search,
  #         synthesis after tool turn, token throughput.
  # Logs: docker logs llm-murderbot-smoke-test
  # Exit code: docker inspect llm-murderbot-smoke-test --format='{{.State.ExitCode}}'
  smoke-test:
    image: python:3.12-alpine
    container_name: llm-murderbot-smoke-test
    restart: "no"
    labels:
      komodo.skip:
    depends_on:
      vllm-server:
        condition: service_healthy
    environment:
      VLLM_URL: "http://vllm-server:8088"
      SEARXNG_URL: "https://searxng.amer.dev"
      EXPECTED_MODEL: "qwen38-27b"
    volumes:
      - ./smoke-test.py:/smoke-test.py:ro
    command: ["python3", "/smoke-test.py"]
