# llama.cpp inference stack on murderbot — NVIDIA RTX PRO 4000 Blackwell (SM_120a)
# Serves huihui-ai/Huihui-Qwen3.6-35B-A3B-abliterated-MTP-GGUF (Q4_K) on port 8088
# LiteLLM routes to http://10.100.20.19:8088 as model alias "qwen36-35b-a3b"
#
# Migration note (2026-07-23): replaces the vLLM+Qwen3.6-27B-NVFP4 setup tagged
# `qwen3.6-27b` in this repo (git checkout qwen3.6-27b -- murderbot/llm/compose.yaml
# to revert). That setup was NOT the problem being solved here — it worked and was
# stable. This migration exists because llama.cpp + this model measurably outperforms
# it on the same hardware: ~120-140 tok/s generation via MTP speculative decoding
# vs ~25-32 tok/s on vLLM, and 98,304 usable context vs 49,152 — a real, benchmarked
# win, not a lateral move. See ~/.claude memory `project_murderbot_llm_migration_2026_07`
# for the full rationale and history (this model+engine combo ran successfully here
# months before the vLLM switch; the switch away from llama.cpp turned out to have
# been unnecessary for this model).
#
# Why llama.cpp over vLLM for THIS model specifically:
#   - Same 24GB card, same hybrid Qwen3.5-MoE architecture (linear/gated-delta-net
#     attention on 30/40 layers, full attention on the other 10), but llama.cpp's
#     memory accounting and MTP (multi-token-prediction speculative decoding)
#     support for this architecture is both more memory-efficient and faster here.
#   - vLLM's NVFP4/compressed-tensors path was tested for this same model on this
#     same card and topped out around ~12.5K usable context (multimodal encoder-
#     cache reservation + mamba-state overhead ate the remaining budget) — see the
#     memory file above for that dead-end. llama.cpp does not carry that overhead.
#
# Why this model (huihui-ai abliterated MTP GGUF, Q4_K):
#   - True weight-level abliteration (not just prompt-based uncensoring like the
#     old --uncensored flag in ~/claude/projects/murderbot/scripts/start-openclaude.sh)
#   - MTP draft heads baked directly into this GGUF — no separate draft model needed
#   - Q4_K (20.22 GiB on disk) is the publisher's own recommended quant tier for
#     this quant family; larger tiers (Q5_K+) don't leave enough headroom on 24GB
#
# Chat template: froggeric's community-maintained Qwen 3.5/3.6 fix (v21.3, see
# murderbot/llm-llamacpp/chat_template.jinja), NOT the GGUF's baked-in template.
# The stock Qwen template has documented tool-calling defects (llama.cpp issue
# #19872: doesn't natively describe tools) and several agentic-loop stalling bugs
# this template specifically fixes — including the exact "XML tool-call text
# leaked as content" failure observed live while testing forced-synthesis turns
# on the vLLM setup (see praetor repo PR #189).
#
# Context length — empirically determined, NOT calculated (learned the hard way
# on the vLLM side that KV-cache math for this hybrid architecture is not linear
# and easy to get wrong; measured every value directly instead of estimating):
#   65536   -> loads cleanly, ~1.7 GiB VRAM headroom (very safe, low context)
#   98304   -> loads cleanly, survived a REAL 96,640-token request (98.3% of this
#              ceiling) with ~850 MiB headroom stable throughout -- THE CHOSEN VALUE
#   114688  -> loads and reports healthy, but CRASHES (CUDA OOM, exit 139) on a
#              real large request -- only 517 MiB headroom at idle was not enough
#              once real compute buffers were needed. "Starts successfully" is not
#              sufficient evidence of fitting; every candidate here was verified
#              under an actual large inference request, not just at server startup.
#   131072  -> fails to allocate KV cache at startup (short by only 256 MiB, in
#              the MTP draft context specifically)
#   262144  -> the model's native max; fails to allocate at startup (short by
#              ~5 GiB) -- nowhere close on this 24GB card with this quant
#
# Key flags:
#   -ngl 99                     : offload all layers to GPU (99 exceeds any real
#                                  layer count -- llama.cpp clamps to actual depth --
#                                  zero CPU/disk fallback, confirmed via VRAM usage
#                                  matching the model's on-disk size almost exactly)
#   -fa on                      : flash attention, required at this model size
#   -np 1                       : single concurrent slot -- matches the old vLLM
#                                  --max-num-seqs 1 setup; this box serves one
#                                  caller at a time (OWU, opencode, praetor workers
#                                  all queue through the same backend)
#   --spec-type draft-mtp
#   --spec-draft-n-max 6        : MTP speculative decoding, values straight from the
#                                  model publisher's own README example command
#   --jinja --chat-template-file: use the froggeric template file, not the GGUF's own
#   -c 98304                    : see context-length section above
#   --metrics                   : Prometheus metrics for the smoke test and monitoring
name: llm-murderbot

services:
  llama-server:
    build:
      context: ../llm-llamacpp
      dockerfile: Dockerfile
    image: llama-cpp-blackwell:b10092
    pull_policy: build
    container_name: llama-server
    restart: unless-stopped
    mem_swappiness: 0
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      - "-m"
      - "/mnt/models/hf/Huihui-Qwen3.6-35B-A3B-abliterated-MTP-GGUF/Huihui-Qwen3.6-35B-A3B-abliterated-ggml-model-Q4_K.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8088"
      - "--alias"
      - "qwen36-35b-a3b"
      - "-ngl"
      - "99"
      - "-fa"
      - "on"
      - "-np"
      - "1"
      - "--spec-type"
      - "draft-mtp"
      - "--spec-draft-n-max"
      - "6"
      - "--jinja"
      - "--chat-template-file"
      - "/chat_template.jinja"
      - "-c"
      - "98304"
      - "--metrics"
    ports:
      - "8088:8088"
    volumes:
      - /mnt/storage/models:/mnt/models
      - ../llm-llamacpp/chat_template.jinja:/chat_template.jinja:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Cold start: reading a 20GB GGUF from disk + full GPU upload + KV cache
      # allocation took ~1m28s in testing on an otherwise-idle host; generous
      # margin here for a busier host or a cold page cache.
      start_period: 600s

  # Smoke test — runs once after llama-server is healthy, validates the deployment.
  # Checks: model loaded, tool calling (JSON not XML), SearXNG search, synthesis
  #         after tool turn, token throughput (MTP should land 80-140+ tok/s).
  # Logs: docker logs llm-murderbot-smoke-test
  # Exit code: docker inspect llm-murderbot-smoke-test --format='{{.State.ExitCode}}'
  smoke-test:
    image: python:3.12-alpine
    container_name: llm-murderbot-smoke-test
    restart: "no"
    labels:
      komodo.skip:
    depends_on:
      llama-server:
        condition: service_healthy
    environment:
      LLAMA_URL: "http://llama-server:8088"
      SEARXNG_URL: "https://searxng.amer.dev"
    volumes:
      - ./smoke-test.py:/smoke-test.py:ro
    command: ["python3", "/smoke-test.py"]
