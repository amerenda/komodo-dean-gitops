name: media-server

# Komodo-managed stack on the murderbot (Debian) Periphery host.
# This stack now relies on k3s Traefik + cert-manager ingress for HTTPS/public routing.
# Config bind-mount root (/mnt/storage/media/config) and library root
# (/mnt/storage) are pre-created with owner 1000:1000 by setup-debian-komodo.yml.

x-dns: &dns-servers
  - 1.1.1.1
  - 8.8.8.8

services:
  profilarr:
    container_name: profilarr
    image: santiagosayshey/profilarr:v1.1.4
    ports:
      - 6868:6868
    volumes:
      - ${PROFILARR_CONFIG}:/config
    environment:
      - TZ=America/New_York
    networks:
      servarr:
    dns: *dns-servers
    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    image: linuxserver/prowlarr:2.3.5
    networks:
      servarr:
    dns: *dns-servers
    ports:
      - 9696:9696
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${PROWLARR_CONFIG}:/config
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.0.3
    container_name: sabnzbd
    networks:
      servarr:
    dns: *dns-servers
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    ports:
      - 8081:8080
    volumes:
      - ${SABNZBD_CONFIG}:/config
      - ${USENET_DOWNLOADS}:/downloads
      - ${USENET_DOWNLOADS_INCOMPLETE}:/incomplete-downloads
    restart: unless-stopped

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.1.1
    networks:
      servarr:
    dns: *dns-servers
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    ports:
      - 7878:7878
    volumes:
      - ${RADARR_CONFIG}:/config
      - ${MOVIES_FOLDER}:/movies
      - ${USENET_DOWNLOADS}:/downloads
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:4.0.17
    container_name: sonarr
    networks:
      servarr:
    dns: *dns-servers
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${SONARR_CONFIG}:/config
      - ${TV_FOLDER}:/tv
      - ${USENET_DOWNLOADS}:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  sonarr-missing-search-cron:
    # Sonarr has no built-in recurring "search for missing episodes" task —
    # see murderbot/media-server/config/sonarr-cron/crontab.txt for why this
    # exists. Same crond shape as mac-mini-m4/docker-maintenance.
    container_name: sonarr-missing-search-cron
    image: docker:27-cli
    command: ["sh", "-c", "crond -f -l 8"]
    environment:
      - SONARR_API_KEY=${SONARR_API_KEY}
    volumes:
      - ${SONARR_CRON_CRONTAB}:/etc/crontabs/root:ro
    networks:
      servarr:
    dns: *dns-servers
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    image: linuxserver/bazarr:1.5.6
    networks:
      servarr:
    dns: *dns-servers
    ports:
      - 6767:6767
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${BAZARR_CONFIG}:/config
      - ${TV_FOLDER}:/tv
      - ${MOVIES_FOLDER}:/movies
    restart: unless-stopped

  jellyfin:
    image: linuxserver/jellyfin:10.11.8
    container_name: jellyfin
    networks:
      servarr:
    dns: *dns-servers
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - JELLYFIN_PublishedServerUrl=$JELLYFIN_URL
      # Mitigation for known EF Core/SQLite "database is locked" contention under
      # concurrent access (scans + playback + multiple simultaneous downloads) —
      # open since 10.9/10.10, not fully fixed as of 10.11.8. Reduces lock frequency,
      # does not eliminate it. See forum.jellyfin.org/t-sqlite-error-database-is-locked
      - JELLYFIN_SQLITE__disableSecondLevelCache=true
    volumes:
      - ${JELLYFIN_CONFIG}:/config
      - ${MOVIES_FOLDER}:/movies
      - ${TV_FOLDER}:/tv
      - ${DISCOVER_FOLDER}:/discover
      - ${TRANSCODE_FOLDER}:/transcode
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 8920:8920
    # Prefer NVIDIA when available (nvidia-container-toolkit); keep /dev/dri for VAAPI fallback.
    gpus: all
    devices:
      - /dev/dri:/dev/dri
    mem_swappiness: 0
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.2.0
    init: true
    container_name: seerr
    networks:
      servarr:
    dns: *dns-servers
    environment:
      - TZ=America/New_York
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      - ${SEERR_CONFIG}:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  recyclarr:
    container_name: recyclarr
    image: ghcr.io/recyclarr/recyclarr:7
    user: "1000:1000"
    environment:
      - TZ=America/New_York
    volumes:
      - ${RECYCLARR_CONFIG}:/config
    networks:
      servarr:
    dns: *dns-servers
    restart: unless-stopped

  # ── Book acquisition/library stack ────────────────────────────────────────
  # calibre owns the canonical library (metadata.db, Author/Title/ tree,
  # calibredb) at CALIBRE_LIBRARY_FOLDER. lazylibrarian searches/acquires via
  # the existing prowlarr/sabnzbd and imports straight into that library via
  # calibredb (see Config -> Processing in the LazyLibrarian UI). calibre-web
  # is the read-facing OPDS/browsing frontend over the same library. All
  # three complementary, not redundant — see murderbot/media-server/README.md.

  calibre:
    container_name: calibre
    image: lscr.io/linuxserver/calibre:9.11.0
    networks:
      servarr:
    dns: *dns-servers
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - HARDCOVER_API_KEY=${HARDCOVER_API_KEY}
    volumes:
      - ${CALIBRE_CONFIG}:/config
      - ${CALIBRE_LIBRARY_FOLDER}:/books
      - ${CALIBRE_CUSTOM_INIT}:/custom-cont-init.d:ro
    ports:
      - 8082:8080 # noVNC desktop GUI, HTTP — LAN-only, no public ingress.
                  # NOT 8080: that's already bound on this host by
                  # zigbee2mqtt's frontend (network_mode: host), missed by
                  # the original port audit since it only grepped murderbot's
                  # own compose.yaml files, not mac-mini-m4/automation's
                  # (zigbee2mqtt evidently also runs on this physical host).
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

  calibre-web:
    container_name: calibre-web
    image: lscr.io/linuxserver/calibre-web:0.6.26
    networks:
      servarr:
    dns: *dns-servers
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      # No DOCKER_MODS here on purpose — calibre already owns calibredb and
      # is the one writer to the library; calibre-web only reads metadata.db
      # natively, no mod needed. Fewer moving parts, fewer things to break.
      - HARDCOVER_TOKEN=${HARDCOVER_API_KEY}
    volumes:
      - ${CALIBREWEB_CONFIG}:/config
      - ${CALIBRE_LIBRARY_FOLDER}:/books
      - ${HARDCOVER_PROVIDER_FILE}:/app/calibre-web/cps/metadata_provider/hardcover.py:ro
    ports:
      - 8083:8083
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8083/"]
      start_period: 20s
      timeout: 5s
      interval: 30s
      retries: 3
    restart: unless-stopped

  lazylibrarian:
    container_name: lazylibrarian
    image: lscr.io/linuxserver/lazylibrarian:9838d6fe-ls314
    networks:
      servarr:
    dns: *dns-servers
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - ${LAZYLIBRARIAN_CONFIG}:/config
      - ${CALIBRE_LIBRARY_FOLDER}:/calibre-library
      - ${USENET_DOWNLOADS}:/downloads
    ports:
      - 5299:5299
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:5299/"]
      start_period: 30s
      timeout: 5s
      interval: 30s
      retries: 3
    restart: unless-stopped

  # One source of truth for book metadata: LazyLibrarian sets the ISBN on
  # import (via its OPF, see calibre_integration.py), this sidecar picks up
  # any book with an ISBN it hasn't synced yet and pulls canonical
  # title/authors/series/tags from Hardcover via calibredb — restricted to
  # the Hardcover source only (--allowed-plugin), no merging with
  # Amazon/Google. Reuses the calibre image (calibredb/fetch-ebook-metadata
  # are headless CLI tools, no Xvfb/GUI needed) but skips s6 entirely via a
  # bare entrypoint override. Books with no ISBN identifier (e.g. only a
  # goodreads id) are a known gap — not handled here.
  calibre-metadata-sync:
    container_name: calibre-metadata-sync
    image: lscr.io/linuxserver/calibre:9.11.0
    entrypoint: ["/bin/bash", "/sync-scripts/loop.sh"]
    networks:
      servarr:
    dns: *dns-servers
    volumes:
      - ${CALIBRE_CONFIG}:/config
      - ${CALIBRE_LIBRARY_FOLDER}:/books
      - ${CALIBRE_SYNC_SCRIPTS}:/sync-scripts:ro
    restart: unless-stopped


networks:
   servarr:
     driver: bridge
